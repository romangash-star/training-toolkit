<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>העמוד לא נמצא · RomanAI</title>

<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alef:wght@400;700&family=Rubik:wght@800;900&display=swap" rel="stylesheet">
<link rel="icon" href="BASEassets/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#faf5ec;--card:#fffdf8;--ink:#2a211b;--mut:#5d5046;--line:#e3d8c6;--brand:#b4502f;--teal:#1f5f5b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Alef,Arial,sans-serif;font-size:18px;line-height:1.7}
a{color:var(--teal);font-weight:700}
a:focus-visible{outline:3px solid #d99a2b;outline-offset:3px}
.skip{position:fixed;top:-70px;inset-inline-start:12px;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:10px}
.skip:focus{top:10px}
header{border-bottom:1px solid var(--line);background:var(--card)}
header div,main,footer{max-width:760px;margin:0 auto;padding:0 22px}
header div{display:flex;align-items:center;justify-content:space-between;height:64px}
.mark{font-family:Rubik,sans-serif;font-weight:900;font-size:22px;text-decoration:none;color:var(--ink);direction:ltr}
.mark span{color:var(--brand)}
main{padding-block:44px 60px}
h1,h2{font-family:Rubik,Alef,sans-serif;font-weight:900;line-height:1.15;margin:0}
h1{font-size:clamp(30px,5vw,44px)}
h2{font-size:23px;margin-top:34px}
p,ul{margin:10px 0 0}
ul{padding-inline-start:22px}
.upd{color:var(--mut);font-size:16px}
footer{padding-block:24px 40px;color:var(--mut);font-size:15px;border-top:1px solid var(--line);display:flex;gap:6px 18px;flex-wrap:wrap}
.big404{font-family:Rubik,sans-serif;font-weight:900;font-size:clamp(90px,22vw,180px);line-height:1;color:var(--brand)}
.btn{display:inline-block;margin-top:22px;background:var(--ink);color:var(--bg);padding:13px 22px;border-radius:999px;text-decoration:none;font-family:Rubik,sans-serif;font-weight:800}
</style>
</head>
<body>
<a class="skip" href="#main">דלג לתוכן העיקרי</a>
<header><div><a class="mark" href="BASEnew/" aria-label="RomanAI, חזרה לאתר">Roman<span>AI</span></a><a href="BASEnew/">חזרה לאתר</a></div></header>
<main id="main">
<div class="big404" aria-hidden="true">404</div>
<h1>העמוד הזה לא נמצא.</h1>
<p>ייתכן שהכתובת השתנתה או שהוקלדה לא נכון.</p>
<a class="btn" id="home" href="/">חזרה לעמוד הראשי</a>
<script>(function(){var b=location.hostname.indexOf('github.io')>-1?'/toolkit/':'/';document.querySelectorAll('a[href^="BASE"]').forEach(function(a){a.setAttribute('href',b+a.getAttribute('href').slice(4))});document.getElementById('home').setAttribute('href',b);var l=document.querySelector('link[rel=icon]');l.href=b+'assets/favicon.svg'})();</script>
</main>
<footer><span>RomanAI · רומן גרינשטיין · עוסק פטור</span><a href="BASEnagishut/">הצהרת נגישות</a><a href="BASEpratiyut/">מדיניות פרטיות</a><a href="BASEtnaim/">תנאי שימוש</a></footer>
</body>
</html>
