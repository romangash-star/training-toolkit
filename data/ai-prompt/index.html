<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מתייעצים עם ה-AI — קבלת החלטות מבוססת נתונים</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alef:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--canvas:#FAF5EC;--paper:#F2EADC;--card:#FFFDF8;--ink:#2A211B;--ink-soft:#6B5D52;--line:#E3D8C6;--brand:#B4502F;--brand-deep:#8F3D22;--root:#D99A2B;--leaf:#2E7D4F;--core-1:#1F5F5B;--sans:'Alef','Segoe UI',Arial,sans-serif;--shadow:0 10px 30px rgba(42,33,27,.12);--shadow-sm:0 3px 12px rgba(42,33,27,.08)}
  *{box-sizing:border-box} html,body{margin:0;min-height:100%}
  body{font-family:var(--sans);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;background:var(--canvas);background-image:radial-gradient(1100px 520px at 78% -8%,rgba(180,80,47,.10),transparent 60%),radial-gradient(900px 480px at 10% 6%,rgba(31,95,91,.09),transparent 60%);display:flex;flex-direction:column;min-height:100vh}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit} textarea,input{font-family:inherit}
  h1,h2,h3,h4{font-weight:700;line-height:1.15;margin:0} a{color:var(--brand-deep)}
  header.bar{display:flex;align-items:center;gap:16px;padding:12px 22px;background:rgba(250,245,236,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
  .brand{display:flex;align-items:center;gap:11px;font-weight:700;font-size:19px;letter-spacing:-.4px}
  .brand .mark{width:28px;height:28px}
  .daytag{font-size:12px;font-weight:700;color:#FFFDF8;background:var(--core-1);padding:3px 10px;border-radius:999px}
  .hublink{margin-inline-start:auto;font-size:14px;font-weight:700;color:var(--ink-soft);text-decoration:none;border:1px solid var(--line);background:#FFFDF8;padding:8px 14px;border-radius:10px}
  .hublink:hover{color:var(--ink);border-color:#CBBDA6}
  .btn{padding:10px 16px;border-radius:11px;font-weight:700;font-size:14px;transition:.15s;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px}
  .btn-brand{background:linear-gradient(135deg,var(--brand),var(--brand-deep));color:#FFFDF8;box-shadow:0 4px 14px rgba(180,80,47,.28)}.btn-brand:hover{background:var(--brand-deep)}
  .btn-ghost{color:var(--ink-soft);border:1px solid var(--line);background:#FFFDF8}.btn-ghost:hover{color:var(--ink);border-color:#CBBDA6}
  .btn-dark{background:var(--ink);color:#FFFDF8}.btn-dark:hover{background:#1C1512}
  .wrap{flex:1;width:100%;max-width:1040px;margin:0 auto;padding:26px 20px 56px}
  .head{text-align:center;margin-bottom:22px}
  .head .eyebrow{display:inline-block;font-size:12px;font-weight:700;letter-spacing:1px;color:#FFFDF8;background:var(--brand);padding:3px 11px;border-radius:999px}
  .head h1{font-size:clamp(30px,5vw,44px);letter-spacing:-1.2px;margin-top:8px}
  .head p{color:var(--ink-soft);max-width:620px;margin:10px auto 0;font-size:15.5px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
  .grid>*{min-width:0}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow-sm)}
  .examples{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
  .ex{font-size:13px;font-weight:700;padding:7px 13px;border-radius:999px;border:1.5px solid var(--line);background:#FFFDF8;color:var(--brand-deep)}
  .ex:hover{border-color:var(--brand);background:#FBF1EA}
  .field{margin-bottom:16px}
  .field .lab{font-size:14px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:8px}
  .field .lab .n{width:22px;height:22px;border-radius:50%;background:var(--core-1);color:#FFFDF8;font-size:12px;display:grid;place-items:center;flex:0 0 auto}
  .field .lab .sub{font-weight:400;color:var(--ink-soft);font-size:12.5px}
  .in-wrap{position:relative}
  textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px 38px;font-size:14.5px;background:#FFFDF8;color:var(--ink);resize:vertical;min-height:64px;line-height:1.5}
  textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(180,80,47,.14)}
  .mic{position:absolute;inset-inline-start:8px;bottom:8px;width:30px;height:30px;border-radius:8px;background:#FFFDF8;border:1px solid var(--line);color:var(--brand-deep);display:grid;place-items:center}
  .mic:hover{border-color:var(--brand);background:#FBF1EA}
  .mic.rec{background:#A8362D;border-color:#A8362D;color:#FFFDF8;animation:pulse 1.1s ease-out infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(228,70,58,.5)}100%{box-shadow:0 0 0 12px rgba(228,70,58,0)}}
  .preview{position:sticky;top:80px}
  .preview h3{font-size:16px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .prompt-box{background:#1C1512;color:#dce9e6;border-radius:14px;padding:18px;font-size:14.5px;line-height:1.7;white-space:pre-wrap;min-height:160px;word-break:break-word;max-height:440px;overflow:auto;margin-top:12px}
  .prompt-box .ph{color:#5f7b78}
  .pv-actions{display:flex;flex-wrap:wrap;gap:9px;margin:0 0 10px}
  .pv-actions .btn{flex:1}
  .field.add textarea{border-color:var(--root);background:#fffaf0}
  .field.add .lab .n{background:var(--root)}
  .addtag{font-size:11.5px;font-weight:700;background:var(--root);color:#fffdf8;border-radius:999px;padding:1px 9px}
  .refill{margin-inline-start:auto;font-size:13px;font-weight:700;color:var(--core-1);text-decoration:underline;text-underline-offset:3px}
  footer.credit{display:flex;align-items:center;justify-content:center;gap:11px;padding:12px 22px;text-align:center;font-size:13px;color:var(--ink-soft);background:rgba(250,245,236,.86);border-top:1px solid var(--line)}
  footer.credit .credit-ava{width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid #FFFDF8;box-shadow:var(--shadow-sm)}
  footer.credit a{color:var(--brand-deep);font-weight:700;text-decoration:none}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#FFFDF8;padding:12px 22px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:100;box-shadow:var(--shadow)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (max-width:820px){.grid{grid-template-columns:1fr}.preview{position:static}}
  @media (prefers-reduced-motion:reduce){.mic.rec{animation:none}.toast{transition:none}}
  .qbox{border:1.5px solid var(--teal,#1f5f5b);background:var(--teal-tint,#dcedea);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:15px;line-height:1.6}
  .qbox .ql{font-size:13px;font-weight:700;color:var(--teal,#1f5f5b);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .qbox .ql a{color:var(--teal,#1f5f5b)}
  .qbox.missing{border-color:var(--warning,#9a6514);background:#fbf1e0}
  .exlabel{font-weight:700;font-size:14.5px;margin-bottom:8px;display:flex;align-items:center}
  .ex.main{background:var(--brand);border-color:var(--brand);color:#fffdf8;font-size:15px;padding:9px 18px;animation:consultPulse 1.5s ease-in-out infinite}
  @keyframes consultPulse{0%,100%{box-shadow:0 0 0 0 rgba(217,154,43,0);transform:scale(1)}50%{box-shadow:0 0 0 7px rgba(217,154,43,.6);transform:scale(1.04)}}
  .ex.main.used{animation:none}
  @media (prefers-reduced-motion:reduce){.ex.main{animation:none}}
  .pastehint{margin-top:10px;font-size:14px;line-height:1.6;background:var(--teal-tint,#dcedea);border-radius:10px;padding:9px 12px;color:var(--ink)}
  .pastehint kbd{font:700 12.5px var(--font-sans,Arial);background:#fffdf8;border:1px solid var(--line);border-radius:5px;padding:1px 6px}
  .toast{max-width:90vw}
</style>
<link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="../../assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../../assets/apple-touch-icon.png">
<link rel="stylesheet" href="../../assets/site.css?v=27">
</head>
<body>
  <header class="bar">
    <div class="brand"><svg class="mark" viewBox="0 0 24 24" fill="none"><path d="M12 3l1.6 4.2L18 8l-3.2 3 .9 4.4L12 13.6 8.3 15.4l.9-4.4L6 8l4.4-.8L12 3Z" fill="#B4502F"/><circle cx="18.5" cy="17.5" r="3" fill="#D99A2B"/></svg>בונה הפרומפט</div>
        <a class='hublink' href='../'>‹ כל הכלים</a>
  </header>

  <main class="wrap">
    <div class="head">
      <h1>מתייעצים עם ה-AI על האתגר משולחן העבודה <small class="dbn">(מבוסס נתונים)</small></h1>
    </div>

    <div class="grid">
      <div class="panel">
        <div class="field">
          <div class="lab"><span class="n">1</span>האתגר משולחן העבודה שלכם <a class="refill" href="../question/">לבונה האתגר</a></div>
          <div class="in-wrap"><textarea id="challenge" aria-label="האתגר משולחן העבודה שלכם"></textarea><button class="mic" data-t="challenge"></button></div>
        </div>
        <div class="field">
          <div class="lab"><span class="n">2</span>על אילו נתונים אתם חושבים להתבסס?</div>
          <div class="in-wrap"><textarea id="data" aria-label="על אילו נתונים אתם חושבים להתבסס"></textarea><button class="mic" data-t="data"></button></div>
        </div>
      </div>

      <div class="preview">
        <div class="panel">
          <h3>הפרומפט</h3>
          <div class="pv-actions">
            <button class="btn btn-brand" onclick="App.toGemini()">העתק ופתח Gemini</button>
            <button class="btn btn-cop" onclick="App.toCopilot()">העתק ופתח Copilot</button>
            <button class="btn btn-ghost" onclick="App.copy()">העתקה</button>
            
          </div>
          <div class="pastehint">בחלון שנפתח: <kbd>Ctrl</kbd>+<kbd>V</kbd> ושליחה.</div>
          <div class="prompt-box" id="preview"></div>
        </div>
      </div>
    </div>
  </main>

  <footer class="credit"><img class="credit-ava" src="../../assets/roman.jpg" alt="רומן גרינשטיין"><span>נבנה ע"י רומן גרינשטיין · <a href="mailto:romangash@gmail.com">romangash@gmail.com</a></span></footer>
  <div class="toast" id="toast"></div>

<script src="../assets/dd.js?v=27"></script>
<script>
const App=(()=>{
  'use strict';
  const LS='dd_ai_prompt_v3';
  const F=['challenge','data'];
  const builder=()=>DD.load('dd_question_v3',{});
  const TEMPLATE='כדי לעזור ל[מי מחליט] להחליט [איזו החלטה]: [מה מודדים] [מתי ואיפה]?';
  /* background from the challenge builder goes into the prompt without being shown */
  function background(){
    const b=builder(), L=[], me=DD.identity();
    if(me) L.push('אני: '+me+'.');
    if((b.problem||'').trim()) L.push('הבעיה שאני רוצה לפתור: '+b.problem.trim());
    const whys=(b.whys||[]).slice(1).map(w=>(w||'').trim()).filter(Boolean);
    if(whys.length) L.push('שאלתי "למה זה קורה?" והגעתי ל:\n'+whys.map((w,i)=>(i+1)+'. '+w).join('\n'));
    const k=b.kpi||{};
    if((k.metric||'').trim()) L.push('איך נדע שהצלחנו (KPI): '+k.metric.trim()+(k.base?', היום '+k.base.trim():'')+(k.target?', יעד '+k.target.trim():'')+(k.date?' עד '+k.date.trim():'')+'.');
    return L.join('\n\n');
  }
  /* part 2 of the builder (where the data might be), as one line per direction */
  function ideasText(){
    const i=DD.builderIdeas(), L=[];
    if(i.internal.length) L.push('בתוך הרשות: '+i.internal.join(', '));
    if(i.open.length) L.push('מידע פתוח: '+i.open.join(', '));
    if(i.field.length) L.push('איסוף בשטח: '+i.field.join(', '));
    return L.join('\n');
  }
  const ROLE='אתה יועץ מנוסה לקבלת החלטות מבוססת נתונים ברשויות מקומיות בישראל. אתה עוזר לי לדייק "אתגר משולחן העבודה": שאלה אחת מבוססת נתונים, שמובילה להחלטה. אתה לא פותר אותו במקומי.';
  const TASK=[
    'המטרה: לוודא שיש לי אתגר משולחן העבודה אמיתי, כזה שאפשר להתחיל לעבוד עליו עם נתונים שכבר קיימים אצלנו או שאפשר להשיג.',
    'עבוד איתי כך:',
    '1. שאל אותי שאלה אחת בכל פעם, וחכה לתשובה שלי. אל תענה במקומי.',
    '2. ברר: מי מחליט ואיזו החלטה, מה בדיוק מודדים, באיזו תקופה ואיפה.',
    '3. ברר אילו נתונים באמת קיימים: באיזו מערכת או קובץ, מאיזו שנה, מי מחזיק אותם, והאם אפשר לקבל אותם. אם נתון חסר, שאל אם אפשר להשיג אותו או לאסוף אותו.',
    '4. אם האתגר רחב מדי, יש בו פתרון מוכן, או שאין נתונים שיכולים לענות עליו, אמור לי את זה ישירות והצע כיוון מצומצם יותר.',
    '5. אחרי כל תשובה שלי, הצג בשורה אחת את הנוסח המעודכן של האתגר.',
    '6. המשך לשאול עד שהאתגר עובר חמש בדיקות: שאלה אחת; בלי פתרון בפנים; עונים עליה בנתונים שיש לנו; ברור מי ישתמש בתשובה; בתחום ההשפעה של הרשות. רק אז סכם.',
    'אל תמציא נתונים, מספרים או מקורות. אם אתה לא יודע אם נתון קיים ברשות, שאל אותי.'
  ].join('\n');
  const END='בסוף השיחה: האתגר משולחן העבודה הסופי במשפט אחד, בתבנית: '+TEMPLATE+' ומתחתיו רשימה קצרה: אילו נתונים נשתמש בהם, איפה הם נמצאים, ומה עוד צריך להשיג.\nכתוב בעברית פשוטה. התחל עכשיו בשאלה הראשונה.';
  /* the challenge follows the builder until the participant edits it here */
  let data={challenge:'', data:'', edited:false, dataEdited:false};

  function init(){
    try{ const s=JSON.parse(localStorage.getItem(LS)); if(s) data=Object.assign(data,s); }catch(e){}
    if(!data.edited) data.challenge=DD.businessQuestion()||'';
    if(!data.dataEdited) data.data=ideasText();
    F.forEach(id=>{ const el=document.getElementById(id); el.value=data[id]||''; el.addEventListener('input',()=>{ data[id]=el.value; if(id==='challenge') data.edited=true; else data.dataEdited=true; persist(); preview(); grow(el); }); grow(el); });
    document.querySelectorAll('.mic').forEach(b=>b.addEventListener('click',()=>dictate(document.getElementById(b.dataset.t),b)));
    preview();
  }
  function grow(el){ el.style.height='auto'; el.style.height=Math.max(110,el.scrollHeight+34)+'px'; }
  function persist(){ try{localStorage.setItem(LS,JSON.stringify(data));}catch(e){} }
  function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function build(){
    const parts=[ROLE], bg=background();
    if(bg) parts.push(bg);
    parts.push('האתגר משולחן העבודה שלי:\n"'+(data.challenge.trim()||'עוד לא ניסחתי. עזור לי לנסח אותו מהבעיה.')+'"');
    parts.push('הנתונים שאני חושב להתבסס עליהם:\n'+(data.data.trim()||'עוד לא בדקתי. עזור לי לברר.'));
    parts.push(TASK, END);
    return parts.join('\n\n');
  }
  function preview(){ document.getElementById('preview').innerHTML=esc(build()); }
  function openWith(url,name){ copy('הועתק ✓ ב-'+name+': Ctrl+V ושליחה'); window.open(url,'_blank','noopener'); }
  function toGemini(){ openWith('https://gemini.google.com/app','Gemini'); }
  function toCopilot(){ openWith('https://m365.cloud.microsoft/chat','Copilot'); }
  function copy(msg){ const t=build(); (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast(typeof msg==='string'?msg:'הפרומפט הועתק ✓')).catch(()=>prompt('העתיקו ידנית:',t)); }

  let recog=null;
  function dictate(el,btn){const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR){toast('הכתבה קולית נתמכת ב‑Chrome / Edge');return;} if(recog){recog.stop();return;} recog=new SR(); recog.lang='he-IL'; recog.interimResults=true; recog.continuous=false; const base=(el.value||'').trim(); btn.classList.add('rec'); recog.onresult=(e)=>{let f='',i='';for(let k=0;k<e.results.length;k++){const r=e.results[k]; if(r.isFinal)f+=r[0].transcript; else i+=r[0].transcript;} el.value=(base?base+' ':'')+(f+i).trim(); el.dispatchEvent(new Event('input',{bubbles:true}));}; recog.onend=()=>{btn.classList.remove('rec');recog=null;el.focus();}; recog.onerror=()=>{btn.classList.remove('rec');recog=null;}; try{recog.start();toast('מקשיב… דברו בעברית');}catch(e){btn.classList.remove('rec');recog=null;} }

  let tt; function toast(m){const el=document.getElementById('toast');el.textContent=m;el.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),2400);}
  return {init,copy,toGemini,toCopilot};
})();
window.App=App; App.init();
</script>
<script src="../../assets/site.js?v=27" data-crumbs='כל ההכשרות|../../;קבלת החלטות מבוססת נתונים|../'></script>
</body>
