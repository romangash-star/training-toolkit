<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>בונה האתגר משולחן העבודה — קבלת החלטות מבוססת נתונים</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alef:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/dd.css?v=27">
<style>
  .wrap{max-width:1040px}
  .narrow{max-width:760px;margin-inline:auto}
  /* stepper: every step is a button; parts are labelled groups */
  .pagehead{text-align:center;margin:0 0 14px}
  .pagehead h1{font-size:clamp(24px,3vw,30px)}
  .stepper{display:flex;align-items:stretch;gap:6px;margin:0 0 18px}
  .sgroup{display:flex;flex-direction:column;gap:5px;min-width:0}
  .sgroup:first-child{flex:5}.sgroup:nth-child(3){flex:1.15}.sgroup:last-child{flex:.9}
  .sglabel{font-size:12.5px;font-weight:700;color:var(--ink-soft);padding-inline-start:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sgroup.on .sglabel{color:var(--brand)}
  .srow{display:flex;align-items:stretch;gap:4px;flex:1}
  .stepper .arrow{display:grid;place-items:center;color:#c4b49a;font-size:18px;font-weight:700;flex:0 0 auto;padding:0 2px}
  .stepper .arrow.part{align-self:flex-end;height:44px}
  .stepper .arrow.done{color:var(--success,#2e7d4f)}
  .stepper .stepbtn{flex:1;width:auto;min-width:0}
  .gap{display:flex;align-items:stretch;gap:8px;margin:4px 0 6px;font-size:14px}
  .gap div{flex:1;border-radius:10px;padding:9px 12px;background:var(--paper)}
  .gap div:last-child{background:var(--teal-tint,#dcedea)}
  .gap div span{display:block;font-weight:700;font-size:12.5px;color:var(--ink-soft)}
  .gap b{align-self:center;color:var(--brand);font-size:20px}
  .whyex{margin:6px 0 0;padding-inline-start:20px;font-size:14px;color:var(--ink-soft);line-height:1.7}
  .gapnote{font-size:14px;margin:0 0 6px;color:var(--ink)}
  .signs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .signs button{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font:700 14px var(--font-sans,Arial);color:var(--ink-soft);text-align:right;cursor:pointer}
  .signs button.on{border-color:var(--success,#2e7d4f);background:#e7f4ec;color:#1e5e45}
  .ladder{display:flex;align-items:stretch;gap:6px;margin:4px 0 14px;font-size:13.5px}
  .ladder div{flex:1;background:var(--paper);border-radius:10px;padding:8px 10px;color:var(--ink-soft)}
  .ladder div span{display:block;font-weight:700;color:var(--ink);font-size:12.5px}
  .ladder div.on{flex:2;background:var(--teal-tint,#dcedea);color:var(--ink)}
  .ladder i{font-style:normal;align-self:center;color:#c4b49a;font-weight:700}
  .stepbtn{display:flex;align-items:center;gap:8px;width:100%;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-weight:700;font-size:14px;color:var(--ink-soft);text-align:right;transition:.15s;cursor:pointer}
  .stepbtn:hover{border-color:var(--teal,#1f5f5b);color:var(--ink)}
  .stepbtn .sn{width:24px;height:24px;border-radius:50%;background:var(--line);color:var(--ink);display:grid;place-items:center;font-size:13px;flex:0 0 auto}
  .stepbtn.done{color:var(--ink)}
  .stepbtn.done .sn{background:var(--success,#2e7d4f);color:#fff}
  .stepbtn.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .stepbtn.on .sn{background:#fff;color:var(--brand)}
  .stephead{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .stephead .num{width:38px;height:38px;border-radius:11px;background:var(--brand);color:#FFFDF8;display:grid;place-items:center;font-size:18px;font-weight:700;flex:0 0 auto}
  .stephead h2{font-size:24px;letter-spacing:-.5px}
  .stephead .of{margin-inline-start:auto;font-size:12.5px;font-weight:700;color:var(--ink-soft);white-space:nowrap}
  .navrow{display:flex;gap:10px;margin-top:6px}
  .navrow .btn{padding:13px 18px;font-size:15.5px;white-space:normal;line-height:1.3}
  .navrow .next{flex:1}
  .why-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .why-row .lbl{flex:0 0 78px;font-weight:700;font-size:14px;color:var(--root)}
  .why-row input{flex:1}
  .chips{display:flex;gap:7px;flex-wrap:wrap}
  .chips button{border:1.5px solid var(--line);background:#FFFDF8;border-radius:999px;padding:8px 16px;font-weight:700;font-size:14px}
  .chips button.on{border-color:var(--brand);background:var(--brand);color:#FFFDF8}
  .three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 4px}
  .three div{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--paper);font-size:13.5px}
  .three b{display:block;font-size:15px;color:var(--brand-deep)}
  .party{text-align:center;padding:14px 8px}
  .party .big{width:56px!important;height:56px!important;font-size:30px!important}
  .party h2{font-size:26px!important}
  .party p{margin:6px 0 14px!important}
  .party .out{line-height:1.7}
  .party .big{width:72px;height:72px;margin:0 auto;border-radius:50%;background:var(--teal);color:#fffdf8;display:grid;place-items:center;font-size:40px;font-weight:700;line-height:1;animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
  .party h2{font-size:30px;justify-content:center;margin-top:10px}
  .party p{color:var(--ink-soft);font-size:16px;margin:8px 0 18px}
  .party .out{text-align:right;font-size:17px}
  @keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
  .srcsum{font-weight:700;text-align:center;border-radius:9px;padding:6px}
  .srcsum.g{background:#E7F4EC;color:#1e5e45}.srcsum.y{background:#FCF3E1;color:#7a5410}.srcsum.r{background:#FBE9E6;color:#7d2a20}
  @media (max-width:760px){.stepper{gap:3px}.stepper{justify-content:center}.sgroup{flex:0 0 auto!important}.sglabel{display:none}.stepper .stepbtn{flex:0 0 auto;padding:7px}.stepper .stepbtn .nm{display:none}.stepper .arrow{font-size:15px;padding:0}.stepper .arrow.part{height:auto;align-self:center}.ladder{flex-direction:column}.ladder i{display:none}.gap{flex-direction:column}.gap b{display:none}.signs{grid-template-columns:1fr}}
  .nextcta{display:flex;margin:18px auto 0;max-width:420px;padding:15px 22px;font-size:17px}
  .idea{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;background:#fff}
  .idea h3{font-size:18px;display:flex;align-items:center}
  .idea p{margin:2px 0 8px;font-size:14.5px;color:var(--ink-soft)}
  .idea .eg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .idea .eg button{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 13px;font-weight:700;font-size:13.5px;color:var(--teal,#1f5f5b)}
  .idea .eg button:hover{border-color:var(--teal,#1f5f5b)}
  .idea textarea{min-height:64px}
  .srcT .delcell .lbl{display:none}
  @media (max-width:700px){
    .srcT thead{display:none}
    .srcT,.srcT tbody{display:block}
    .srcT tr{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--paper)}
    .srcT td{border:none;padding:0;display:block}
    .srcT td::before{content:attr(data-label);display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:3px}
    .srcT td:nth-child(1),.srcT td.delcell{grid-column:1 / -1}
    .srcT .delcell .lbl{display:inline}.srcT .delcell{text-align:left}
  }
  @media (max-width:640px){.three{grid-template-columns:1fr}.why-row{flex-direction:column;align-items:stretch;gap:3px}.why-row .lbl{flex:none}.stephead h2{font-size:20px}}
</style>

<body>
  <header class="bar">
    <div class="brand"><svg class="mark" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#B4502F" stroke-width="2"/><path d="M9.5 9.3a2.6 2.6 0 015 .9c0 1.8-2.5 2.2-2.5 3.8" stroke="#D99A2B" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17.2" r="1.2" fill="#D99A2B"/></svg>בונה האתגר משולחן העבודה</div>
    <span class="daytag">יום 1</span>
    <a class="hublink" href="../">‹ כל הכלים</a>
  </header>

  <main class="wrap" id="app"></main>

  <footer class="credit"><img class="credit-ava" src="../../assets/roman.jpg" alt="רומן גרינשטיין"><span>נבנה ע"י רומן גרינשטיין · <a href="mailto:romangash@gmail.com">romangash@gmail.com</a></span></footer>
  <div class="toast" id="toast"></div>

<script src="../assets/dd.js?v=27"></script>
<script>
const Q=(()=>{
  'use strict';
  /* Follows the day-1 deck, slides 26–37: the pain, the four components, five checks, five whys.
     Where the data might be and the KPI (slides 38–45) are the next tool. */
  const LS='dd_question_v3', E=DD.esc;
  const DBN='<small class="dbn">(מבוסס נתונים)</small>';
  const FIELDS=[
    {k:'who',     l:'מי מחליט',    ph:'מנהלת האגף לפיתוח כלכלי',                      h:'למי התשובה מיועדת: ראש הרשות, מנהל האגף, הוועדה?'},
    {k:'decision',l:'איזו החלטה',  ph:'באילו עסקים לתמוך',                            h:'מה נבחר, נשנה או נתקצב בעקבות התשובה?'},
    {k:'measure', l:'מה מודדים',   ph:'אילו עסקים נסגרו, ומה מבדיל אותם מאלה ששרדו', h:'משהו שאפשר לספור או להשוות, לא ״שביעות רצון״ כללית.'},
    {k:'scope',   l:'מתי ואיפה',   ph:'במרכז המסחרי, בשנתיים האחרונות',               h:'באיזו תקופה, באילו שכונות, לאיזו אוכלוסייה.'}
  ];
  /* slide 36 */
  const WHY_PH=['יש ערימות אשפה ליד הפחים בשכונה','הפחים מתמלאים לפני יום הפינוי','כמות האשפה בשכונה גדלה בשנה האחרונה','אוכלסו בשכונה מאות דירות חדשות','כמות הפינויים לא עודכנה מאז האכלוס','אין תהליך שמחבר נתוני ארנונה ואכלוס לתכנון הפינוי'];
  const TESTS=[
    {q:'שאלה אחת', d:'לא שלוש שאלות במשפט אחד.'},
    {q:'בלי פתרון בפנים', d:'לא ״איך נקים אפליקציה ש…״.'},
    {q:'עונים עליה בנתונים', d:'אפשר לדמיין טבלה או גרף.'},
    {q:'ברור מי ישתמש בתשובה', d:'יש מחליט, ויש החלטה שהתשובה משרתת.'},
    {q:'בתחום ההשפעה שלנו', d:'הרשות יכולה לפעול לפיה.'}
  ];
  /* slides 39–40: three directions, with the deck's example */
  const SIGNS=['פוגע ביכולת לבצע את המשימה','חוזר על עצמו שוב ושוב','יש לו עלות: בזמן, בכסף או באמון','תושבים או עובדים מתלוננים עליו'];
  const SOLUTION_WORDS=/^\s*(אין|חסר|חסרים|חסרה|צריך|צריכים|לא מספיק|אנחנו צריכים|יש צורך|איך נקים|איך נבנה)/;
  const STEPS=['pain','template','tests','whys','export'];
  const STEP_NAMES=['הכאב','ניסוח האתגר','5 בדיקות','5 פעמים למה','מוכן'];
  const PARTS=[{t:'האתגר משולחן העבודה',steps:[0,1,2,3]},{t:'',steps:[4]}];

  function fresh(){ return { step:0, problem:'', whys:['','','','','',''],
    q:{who:'',decision:'',measure:'',scope:'',own:''}, tests:TESTS.map(()=>''),
    kpi:{metric:'',base:'',target:'',date:'',output:''},
    ideas:{internal:'',open:'',field:''}, signs:[false,false,false,false] }; }
  let data=DD.load(LS,fresh());
  data.ideas=Object.assign({internal:'',open:'',field:''},data.ideas||{});
  if(!Array.isArray(data.signs)) data.signs=[false,false,false,false];
  function save(){ DD.save(LS,data); }

  const slot=html=>(v,ph)=>{ v=(v||'').trim(); return html ? `<span class="slot ${v?'':'empty'}">${E(v||ph)}</span>` : (v||'['+ph+']'); };
  /* the question in the participant's own words wins over the assembled one */
  function sentence(html){ const own=(data.q.own||'').trim(); return own ? (html?E(own):own) : DD.questionSentence(data.q, slot(html)); }
  const plain=t=>E(t).replace(/\n/g,'<br>');
  const root=()=>[...data.whys].reverse().find(w=>w.trim())||'';

  const SCREENS={
    pain:()=>`
      ${head(1,'הכאב'+DD.help('כתבו מה <b>לא עובד היום</b>, מנקודת המבט של התושב או של העובדים, בלי פתרון בפנים. במקום ״אין מספיק פקחים״ כתבו ״הטיפול בפנייה לוקח יותר מ-14 יום״.'),'שלב 1 מתוך 4')}
      <p class="lead">חזרו לרשימה שעשיתם בתחילת היום (<a href="../role-worksheet/">מה אני עושה ברשות</a>): איפה הציבור הכי מתלונן? איפה תהליך נתקע? בחרו בעיה <b>שיש לכם עליה נתונים</b>, ושאתם רוצים להתעסק בה.</p>
      <div class="gap">
        <div><span>המצוי</span>תושב ממתין 3 שבועות לאישור, ולא יודע באיזה שלב הבקשה</div>
        <b aria-hidden="true">⇄</b>
        <div><span>הרצוי</span>אישור תוך ימים, עם עדכון שקוף בכל שלב</div>
      </div>
      <p class="gapnote"><b>כאב = הפער בין הרצוי למצוי.</b> ככל שהפער גדול יותר, חוזר יותר ויקר יותר, כך כדאי יותר לטפל בו.</p>
      <div class="field-label">הכאב שלכם</div>
      <textarea id="problem" style="min-height:100px" aria-label="הכאב שלכם">${E(data.problem)}</textarea>
      <div id="probWarn"></div>
      <div class="field-label">כאב אמיתי, או רק חוסר נוחות?${DD.help('המבחן: האם זה פוגע במשהו אמיתי, או שזה פשוט מעצבן? חוסר נוחות הוא חד-פעמי, לא חוסם, ונעלם מעצמו עם הזמן. מחפשים כאב אמיתי.')}</div>
      <div class="signs">${SIGNS.map((x,i)=>`<button type="button" class="${data.signs[i]?'on':''}" aria-pressed="${!!data.signs[i]}" onclick="Q.sign(${i})">${data.signs[i]?'✓ ':''}${x}</button>`).join('')}</div>
      <div id="signNote"></div>`,
    template:()=>`
      ${head(2,'ניסוח האתגר'+DD.help('אתגר משולחן העבודה הוא לא נושא ולא תלונה. זו שאלה שמובילה להחלטה, ושאפשר לענות עליה בנתונים. המבחן: <b>אם נקבל תשובה, מה נעשה אחרת?</b>'),'שלב 2 מתוך 4')}
      <div class="ladder">
        <div><span>נושא</span>״העסקים במרכז המסחרי״</div><i aria-hidden="true">←</i>
        <div><span>תלונה</span>״עסקים נסגרים כל הזמן״</div><i aria-hidden="true">←</i>
        <div class="on"><span>אתגר משולחן העבודה</span>״אילו עסקים במרכז המסחרי נסגרו בשנתיים האחרונות, ומה מבדיל אותם מאלה ששרדו?״</div>
      </div>
      <p class="lead">ארבעה רכיבים של שאלה טובה. המשפט נבנה בזמן שאתם כותבים.</p>
      <div class="grid2">${FIELDS.map(f=>`<div><div class="field-label" style="margin-top:4px">${f.l}${DD.help(f.h)}</div><input class="txt" data-q="${f.k}" aria-label="${f.l}" value="${E(data.q[f.k])}"></div>`).join('')}</div>
      <div style="margin-top:10px"><button class="btn btn-ghost btn-sm" onclick="Q.example()">הדוגמה מהמצגת</button></div>
      <div class="field-label">האתגר שלכם</div>
      <div class="out" id="sentence"></div>
      <details class="more"><summary>רוצים לנסח במילים שלכם? מה שתכתבו כאן יופיע בייצוא</summary>
        <textarea data-q="own" style="margin-top:8px" aria-label="האתגר במילים שלכם">${E(data.q.own)}</textarea></details>`,
    tests:()=>`
      ${head(3,'חמש בדיקות לאתגר שלכם'+DD.help('בדיקה עצמית לפני שממשיכים. אם עניתם ״לא״ על אחת מהן, חוזרים לשלב 2 ומחדדים את הניסוח.'),'שלב 3 מתוך 4')}
      <div class="out" style="font-size:15.5px;margin-bottom:14px">${plain(sentence(false))}</div>
      ${TESTS.map((t,i)=>`
        <div class="check ${data.tests[i]==='y'?'on':data.tests[i]==='n'?'bad':''}">
          <div class="top" style="cursor:default;align-items:center"><div><div class="ttl">${t.q}</div><div class="q">${t.d}</div></div>
            <div class="yn"><button class="y ${data.tests[i]==='y'?'on':''}" onclick="Q.test(${i},'y')">כן</button><button class="n ${data.tests[i]==='n'?'on':''}" onclick="Q.test(${i},'n')">לא</button></div></div>
        </div>`).join('')}
      ${data.tests.includes('n')?'<div class="callout warn">עניתם "לא" על אחת הבדיקות. <a href="#" onclick="Q.go(1);return false">חוזרים ומחדדים את הניסוח ←</a></div>':''}`,
    whys:()=>`
      ${head(4,'חמש פעמים "למה"'+DD.help('בכל שורה עונים על ״למה זה קורה?״ לגבי השורה שמעליה. לא חייבים למלא את כל החמש: עוצרים כשמגיעים לסיבה שאפשר לבדוק ולתקן.'),'שלב 4 מתוך 4')}
      <p class="lead">יורדים לשורש: שואלים "למה?" שוב ושוב. אם השורש שונה ממה שניסחתם, <a href="#" onclick="Q.go(1);return false">חוזרים לניסוח</a> ומעדכנים.</p>
      ${data.whys.map((w,i)=>`<div class="why-row"><span class="lbl">${i===0?'הכאב':'← למה? '+i}</span><input class="txt" data-why="${i}" aria-label="${i===0?'הכאב':'למה '+i}" value="${E(w)}"></div>`).join('')}
      <details class="more"><summary>הדוגמה מהמצגת</summary><ol class="whyex">${WHY_PH.map((w,i)=>`<li>${i?'למה? ':''}${E(w)}</li>`).join('')}</ol></details>
      <div class="field-label">השורש שאליו הגעתם</div>
      <div class="out" id="root"></div>`,
    export:()=>`
      <div class="party">
        <div class="big">✓</div>
        <h2>יש לכם אתגר משולחן העבודה ${DBN}</h2>
        <div class="out">${plain(sentence(false))}</div>
        <div class="exportbar" style="margin:16px 0 0">
          <button class="btn btn-ghost" onclick="Q.doc()">ייצוא ל-Word</button>
          <button class="btn btn-ghost" onclick="Q.copyAll()">העתקה</button>
          <button class="btn btn-ghost" onclick="Q.saveJson()">שמירה</button>
          <button class="btn btn-ghost" onclick="Q.loadJson()">טעינה</button>
        </div>
        <a class="btn btn-brand nextcta" href="../kpi/">ממשיכים: איתור מקורות מידע ומדדי הצלחה ←</a>
        <div style="margin-top:14px"><button class="btn btn-ghost btn-sm" onclick="Q.reset()">להתחיל מחדש</button></div>
      </div>`
  };
  function head(n,t,of){ return `<div class="stephead"><span class="num">${n}</span><h2>${t}</h2><span class="of">${of}</span></div>`; }

  function render(){
    const st=data.step, key=STEPS[st], last=STEPS.length-1;
    const btn=k=>`<button class="stepbtn ${st===k?'on':st>k?'done':''}" onclick="Q.go(${k})" ${st===k?'aria-current="step"':''}><span class="sn">${st>k||k===last?'✓':k+1}</span><span class="nm">${STEP_NAMES[k]}</span></button>`;
    const arrow=k=>`<span class="arrow ${st>=k?'done':''}" aria-hidden="true">←</span>`;
    const stepper=PARTS.map((p,i)=>`<div class="sgroup${p.steps.includes(st)?' on':''}">${p.t?`<div class="sglabel">${p.t}</div>`:'<div class="sglabel">&nbsp;</div>'}<div class="srow">${p.steps.map((k,j)=>(j?arrow(k):'')+btn(k)).join('')}</div></div>`).join(`<span class="arrow part" aria-hidden="true">←</span>`);
    const nextLabel={whys:'סיימתי, לאתגר המוכן ←'}[key]||'הבא: '+STEP_NAMES[st+1]+' ←';
    document.getElementById('app').innerHTML=`
      <div class="pagehead"><h1>בונה האתגר משולחן העבודה ${DBN}</h1></div>
      <nav class="stepper" aria-label="שלבים">${stepper}</nav>
      <div class="panel narrow">${SCREENS[key]()}</div>
      <div class="navrow narrow">
        ${st>0?'<button class="btn btn-ghost" onclick="Q.go('+(st-1)+')">→ הקודם</button>':''}
        ${st<last?`<button class="btn btn-brand next" onclick="Q.go(${st+1})">${nextLabel}</button>`:''}
      </div>`;
    wire(); paintLive();
  }
  function wire(){
    const on=(sel,fn)=>document.querySelectorAll(sel).forEach(el=>el.addEventListener('input',()=>{fn(el);save();paintLive();}));
    on('#problem',el=>data.problem=el.value);
    on('[data-why]',el=>data.whys[+el.dataset.why]=el.value);
    on('[data-q]',el=>data.q[el.dataset.q]=el.value);
  }
  function paintLive(){
    const set=(id,html)=>{const el=document.getElementById(id); if(el) el.innerHTML=html;};
    const p=data.problem.trim();
    const n=data.signs.filter(Boolean).length;
    set('signNote', !n ? '' : n>=2 ? '<div class="callout ok">נשמע כמו כאב אמיתי. ממשיכים.</div>' : '<div class="callout warn">סימן אחד בלבד: אולי זה חוסר נוחות. נסו לחדד, או לבחור בעיה אחרת.</div>');
    set('probWarn', p&&SOLUTION_WORDS.test(p) ? '<div class="callout warn">זה נשמע כמו <b>פתרון</b>, לא כמו כאב. נסו לתאר מה לא עובד היום, רצוי במספר.</div>' : '');
    set('root', root()?E(root()):'<span style="color:#9aa6b1">יופיע כאן</span>');
    set('sentence', sentence(true));
  }
  function go(n){
    if(!data.whys[0].trim() && data.problem.trim()) data.whys[0]=data.problem;   // the pain opens the "why" chain
    data.step=Math.max(0,Math.min(STEPS.length-1,n)); save(); render(); window.scrollTo({top:0,behavior:'smooth'});
  }
  if(!(data.step>=0 && data.step<STEPS.length)) data.step=0;   // saves from an older step layout
  function sign(i){ data.signs[i]=!data.signs[i]; save(); render(); }
  function test(i,v){ data.tests[i]=data.tests[i]===v?'':v; save(); render(); }
  function example(){
    if(FIELDS.some(f=>data.q[f.k].trim()) && !confirm('להחליף את מה שכתבתם בדוגמה?')) return;
    FIELDS.forEach(f=>data.q[f.k]=f.ph); data.q.own='';
    save(); render();
  }

  /* ---------- export ---------- */
  const TITLE='האתגר משולחן העבודה (מבוסס נתונים)';
  function asText(){
    const L=[TITLE+(DD.identity()?' · '+DD.identity():''),''];
    L.push('הכאב: '+(data.problem||'—'));
    const sg=SIGNS.filter((_,i)=>data.signs[i]); if(sg.length) L.push('סימנים לכאב אמיתי: '+sg.join(' · '));
    L.push('','האתגר: '+sentence(false),'');
    TESTS.forEach((t,i)=>L.push(`  ${data.tests[i]==='y'?'✓':data.tests[i]==='n'?'✗':'☐'} ${t.q}`));
    if(data.whys.slice(1).some(Boolean)){ L.push('','חמש פעמים למה:'); data.whys.forEach((w,i)=>{ if(i>0&&w) L.push(`  למה ${i}: ${w}`); }); }
    return L.join('\n');
  }
  function copyQuestion(){ DD.copy('האתגר שלי משולחן העבודה\n'+sentence(false),'האתגר הועתק ✓'); }
  function docQuestion(){
    DD.downloadDoc('האתגר משולחן העבודה',TITLE,'<h1>'+E(TITLE)+'</h1><p>'+E(DD.identity())+'</p><p style="font-size:16px">'+plain(sentence(false))+'</p>');
    DD.toast('המסמך הורד');
  }
  function copyAll(){ DD.copy(asText()); }
  function doc(){
    const h=s=>'<h2>'+E(s)+'</h2>', p=s=>'<p>'+E(s||'—').replace(/\n/g,'<br>')+'</p>';
    let b='<h1>'+E(TITLE)+'</h1><p>'+E(DD.identity())+'</p>';
    b+=p('הכאב: '+data.problem);
    b+='<p style="font-size:15px"><b>האתגר:</b> '+plain(sentence(false))+'</p>';
    b+='<table>'+TESTS.map((t,i)=>'<tr><td>'+E(t.q)+'</td><td>'+(data.tests[i]==='y'?'✓ כן':data.tests[i]==='n'?'✗ לא':'')+'</td></tr>').join('')+'</table>';
    if(data.whys.slice(1).some(Boolean)) b+='<p><b>חמש פעמים למה</b></p><ol>'+data.whys.slice(1).filter(Boolean).map(w=>'<li>'+E(w)+'</li>').join('')+'</ol>';
    DD.downloadDoc('האתגר משולחן העבודה',TITLE,b); DD.toast('המסמך הורד');
  }
  function saveJson(){ DD.download(DD.safeName(data.q.decision,'אתגר משולחן העבודה')+'.json', JSON.stringify(data,null,2)); }
  function loadJson(){ DD.loadFile(d=>{ data=Object.assign(fresh(),d); save(); render(); }); }
  function reset(){ if(confirm('למחוק את כל מה שמילאתם ולהתחיל מחדש?')){ data=fresh(); save(); render(); } }

  render();
  return {go,sign,test,example,copyQuestion,docQuestion,copyAll,doc,saveJson,loadJson,reset};
})();
</script>
<script src="../../assets/site.js?v=27" data-crumbs='כל ההכשרות|../../;קבלת החלטות מבוססת נתונים|../'></script>
