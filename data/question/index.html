<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>בונה השאלה העסקית — קבלת החלטות מבוססת נתונים</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alef:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/dd.css?v=10">
<style>
  .wrap{max-width:760px}
  /* stepper: every step is a button; parts are labelled groups */
  .parts{display:grid;grid-template-columns:4fr 1.25fr 1.25fr;gap:10px;margin:0 0 18px;align-items:stretch}
  .part{background:var(--surface-card,#fffdf8);border:1px solid var(--line);border-radius:14px;padding:10px 10px 12px;display:flex;flex-direction:column;gap:8px}
  .part.on{border-color:var(--teal,#1f5f5b);box-shadow:0 0 0 2px var(--teal-tint,#dcedea)}
  .part .pt{font-size:13px;font-weight:700;color:var(--ink-soft);padding-inline-start:4px}
  .part .pt b{color:var(--ink);font-size:15px}
  .part .steps{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;flex:1}
  .stepbtn{display:flex;align-items:center;gap:8px;width:100%;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-weight:700;font-size:14px;color:var(--ink-soft);text-align:right;transition:.15s;cursor:pointer}
  .stepbtn:hover{border-color:var(--teal,#1f5f5b);color:var(--ink)}
  .stepbtn .sn{width:24px;height:24px;border-radius:50%;background:var(--line);color:var(--ink);display:grid;place-items:center;font-size:13px;flex:0 0 auto}
  .stepbtn.done{color:var(--ink)}
  .stepbtn.done .sn{background:var(--success,#2e7d4f);color:#fff}
  .stepbtn.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .stepbtn.on .sn{background:#fff;color:var(--brand)}
  .stephead{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .stephead .num{width:38px;height:38px;border-radius:11px;background:var(--brand);color:#FFFDF8;display:grid;place-items:center;font-size:18px;font-weight:700;flex:0 0 auto}
  .stephead h2{font-size:24px;letter-spacing:-.5px}
  .stephead .of{margin-inline-start:auto;font-size:12.5px;font-weight:700;color:var(--ink-soft);white-space:nowrap}
  .navrow{display:flex;gap:10px;margin-top:6px}
  .navrow .btn{padding:13px 18px;font-size:15.5px;white-space:normal;line-height:1.3}
  .navrow .next{flex:1}
  .why-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .why-row .lbl{flex:0 0 78px;font-weight:700;font-size:14px;color:var(--root)}
  .why-row input{flex:1}
  .chips{display:flex;gap:7px;flex-wrap:wrap}
  .chips button{border:1.5px solid var(--line);background:#FFFDF8;border-radius:999px;padding:8px 16px;font-weight:700;font-size:14px}
  .chips button.on{border-color:var(--brand);background:var(--brand);color:#FFFDF8}
  .three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 4px}
  .three div{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--paper);font-size:13.5px}
  .three b{display:block;font-size:15px;color:var(--brand-deep)}
  .party{text-align:center;padding:26px 8px}
  .party .out{line-height:1.7}
  .party .big{width:72px;height:72px;margin:0 auto;border-radius:50%;background:var(--teal);color:#fffdf8;display:grid;place-items:center;font-size:40px;font-weight:700;line-height:1;animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
  .party h2{font-size:30px;justify-content:center;margin-top:10px}
  .party p{color:var(--ink-soft);font-size:16px;margin:8px 0 18px}
  .party .out{text-align:right;font-size:17px}
  @keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
  .srcsum{font-weight:700;text-align:center;border-radius:9px;padding:6px}
  .srcsum.g{background:#E7F4EC;color:#1e5e45}.srcsum.y{background:#FCF3E1;color:#7a5410}.srcsum.r{background:#FBE9E6;color:#7d2a20}
  @media (max-width:760px){.parts{grid-template-columns:1fr 1fr}.part.p0{grid-column:1 / -1}.part.p0 .steps{grid-auto-flow:row;grid-template-columns:1fr 1fr}}
  .srcT .delcell .btn{font-size:0;padding:6px 10px}.srcT .delcell .btn::first-letter{font-size:14px}
  @media (max-width:700px){
    .srcT thead{display:none}
    .srcT,.srcT tbody{display:block}
    .srcT tr{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--paper)}
    .srcT td{border:none;padding:0;display:block}
    .srcT td::before{content:attr(data-label);display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:3px}
    .srcT td:nth-child(1),.srcT td:nth-child(2),.srcT td:nth-child(7),.srcT td.delcell{grid-column:1 / -1}
    .srcT .delcell .btn{font-size:13px}.srcT .delcell{text-align:left}
  }
  @media (max-width:640px){.three{grid-template-columns:1fr}.why-row{flex-direction:column;align-items:stretch;gap:3px}.why-row .lbl{flex:none}.stephead h2{font-size:20px}}
</style>
<link rel="stylesheet" href="../../assets/site.css?v=10">
</head>
<body>
  <header class="bar">
    <div class="brand"><svg class="mark" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#B4502F" stroke-width="2"/><path d="M9.5 9.3a2.6 2.6 0 015 .9c0 1.8-2.5 2.2-2.5 3.8" stroke="#D99A2B" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17.2" r="1.2" fill="#D99A2B"/></svg>בונה השאלה העסקית</div>
    <span class="daytag">יום 1</span>
    <a class="hublink" href="../">‹ כל הכלים</a>
  </header>

  <main class="wrap" id="app"></main>

  <footer class="credit"><img class="credit-ava" src="../../assets/roman.jpg" alt="רומן גרינשטיין"><span>נבנה ע"י רומן גרינשטיין · <a href="mailto:romangash@gmail.com">romangash@gmail.com</a></span></footer>
  <div class="toast" id="toast"></div>

<script src="../assets/dd.js?v=10"></script>
<script>
const Q=(()=>{
  'use strict';
  const LS='dd_question_v2', E=DD.esc;
  const FIELDS=[
    {k:'who',  l:'מי מחליט',     ph:'מנהל אגף שפ"ע', h:'אדם אחד, עם שם או תפקיד, שבסמכותו להחליט. לא ״העירייה״ ולא ״ההנהלה״.'},
    {k:'what', l:'מה בדיוק',     ph:'איך לחלק שש משרות פיקוח בין חמישה אזורים', h:'ההחלטה עצמה: מה בדיוק צריך לבחור או לקבוע.'},
    {k:'when', l:'עד מתי',       ph:'1 בינואר', h:'תאריך שבו ההחלטה חייבת להתקבל. בלי תאריך זה לא יקרה.'},
    {k:'goal', l:'תוצאה מדידה',  ph:'להוריד את זמן הטיפול החציוני מ-11 ל-7 ימים', h:'מה רוצים להשיג, במספר: מכמה לכמה. עדיף <b>חציון</b> ולא ממוצע, כי כמה מקרים קיצוניים מעוותים ממוצע.'},
    {k:'limit',l:'במסגרת אילוץ', ph:'בלי תוספת תקציב', h:'מה אסור או אי אפשר לשנות: תקציב, כוח אדם, חוק, זמן.'}
  ];
  const WHY_PH=['התושבים לא מרוצים מהמוקד','כי הפניות לא נסגרות בזמן','כי הן עוברות בין שלוש מחלקות','כי אין הגדרה ברורה מי אחראי לכל סוג פנייה','כי טבלת הסיווג לא עודכנה מ-2019','כי אף אחד לא אחראי על תחזוקת טבלת הסיווג'];
  const TESTS=[
    {q:'יש מחליט מזוהה בשם?', no:'זה לא פרויקט, זה תחביב.'},
    {q:'התשובה תשנה משהו בפועל?', no:'שאלה מעניינת שלא מובילה להחלטה. מוותרים עליה.'},
    {q:'יש תאריך להחלטה?', no:'בלי תאריך זה לא יקרה.'},
    {q:'יש נתון שיכול לענות?', no:'צריך קודם תוכנית איסוף. גם זה תוצר לגיטימי.'},
    {q:'התשובה עשויה להפתיע אתכם?', no:'אם אתם כבר יודעים, אתם מחפשים אישוש.'}
  ];
  const PERIODS=['חצי שנה','שנה','שנתיים'];
  const KPI=[
    {k:'output', l:'תפוקה: מה נעשה עד אז?',            ph:'נחתום על SLA מול תאגיד המים ונקיים בקרה חודשית'},
    {k:'outcome',l:'תוצאה: מה ישתנה בשטח?',            ph:'זמן הטיפול החציוני בפניות מים וביוב ירד מ-18 ל-10 ימים'},
    {k:'impact', l:'השפעה: מה ירגישו התושבים?',         ph:'פחות תלונות חוזרות, ושביעות הרצון מהמוקד באזור ג׳ תעלה'},
    {k:'measure',l:'איך נמדוד את זה בעצמנו?', h:'מאיפה יגיע המספר: דוח ממערכת, ספירה ידנית, סקר קצר. משהו שאתם יכולים להוציא לבד.', ph:'דוח חודשי ממערכת המוקד וסקר קצר לפונים'}
  ];
  const DIMS=[
    {k:'avail', l:'זמינות',  h:'כמה קל להשיג את הנתון. 3 = אתם מוציאים אותו לבד.', o:['צריך לבקש ולחכות','קיים אצל מישהו','ייצוא עצמאי']},
    {k:'full',  l:'שלמות',   h:'כמה מהנתון באמת מולא. 3 = כמעט אין תאים ריקים.', o:['חסר מעל 30%','חסר מעט','מלא']},
    {k:'fresh', l:'עדכניות', h:'כל כמה זמן הנתון מתעדכן. 3 = כל חודש או בזמן אמת.', o:['שנתי','רבעוני','חודשי / שוטף']},
    {k:'trust', l:'אמינות',  h:'איך הנתון נרשם. 3 = המערכת רושמת אוטומטית, בלי הקלדה ידנית.', o:['הזנה ידנית חופשית','מובנית חלקית','אוטומטי מהמערכת']}
  ];
  const SRC_PH=['פניות למוקד: קטגוריה, אזור, זמני טיפול','נתוני גבייה וארנונה','מספר תושבים לפי אזור','תקנים, איוש ונוכחות','סקר שביעות רצון'];
  const SOLUTION_WORDS=/^\s*(אין|חסר|חסרים|חסרה|צריך|צריכים|לא מספיק|אנחנו צריכים|יש צורך)/;
  /* step list: part 1 has four steps and a finish screen; parts 2 and 3 one step each; then the export screen */
  const STEPS=['problem','whys','template','tests','done1','kpi','sources','export'];
  const STEP_NAMES=['הבעיה שלי','5 פעמים למה','השאלה העסקית','מבחן 5 השאלות','','איך נדע שהצלחנו','מפת המקורות',''];
  const PARTS=[{n:'חלק 1',t:'השאלה העסקית',from:0,to:4},{n:'חלק 2',t:'איך נדע שהצלחנו',from:5,to:5},{n:'חלק 3',t:'מפת המקורות',from:6,to:6}];
  const newSrc=()=>({name:'',owner:'',avail:0,full:0,fresh:0,trust:0});

  function fresh(){ return { step:0, problem:'', whys:['','','','','',''],
    q:{who:'',what:'',when:'',goal:'',limit:'',question:''}, tests:TESTS.map(()=>''),
    kpi:{period:'',output:'',outcome:'',impact:'',measure:''},
    sources:[0,1,2,3,4].map(newSrc) }; }
  let data=DD.load(LS,fresh());
  function save(){ DD.save(LS,data); }

  function sentence(html){
    const s=(k,ph)=>{ const v=(data.q[k]||'').trim(); return html ? `<span class="slot ${v?'':'empty'}">${E(v||ph)}</span>` : (v||'['+ph+']'); };
    return `${s('who','מי מחליט')} צריך להחליט ${s('what','מה בדיוק')} עד ${s('when','מתי')}, כדי ${s('goal','תוצאה מדידה')}, ${s('limit','אילוץ')}.`
      + (html?'<br><b>השאלה:</b> ':'\nהשאלה: ') + s('question','שאלה שאפשר לענות עליה בנתונים');
  }
  function kpiSentence(html){
    const k=data.kpi, s=(key,ph)=>{ const v=(k[key]||'').trim(); return html ? `<span class="slot ${v?'':'empty'}">${E(v||ph)}</span>` : (v||'['+ph+']'); };
    return `בעוד ${s('period','תקופה')} נדע שהצלחנו אם ${s('output','תפוקה')}, ${s('outcome','תוצאה')}, ו${s('impact','השפעה')}. נמדוד את זה באמצעות ${s('measure','איך נמדוד')}.`;
  }
  /* finished sentences read as plain text; the underlined slots are only for the screen where they are being filled */
  const plain=t=>E(t).replace(/\n/g,'<br>');
  const root=()=>[...data.whys].reverse().find(w=>w.trim())||'';
  function srcScore(r){ return DIMS.every(d=>r[d.k]) ? DIMS.reduce((a,d)=>a+r[d.k],0) : 0; }
  function srcVerdict(n){ return !n?['','—']: n>=8?['g','מתחילים ממנו']: n>=6?['y','בזהירות']:['r','לא בונים עליו השנה']; }

  /* ---------- screens ---------- */
  const SCREENS={
    problem:()=>`
      ${head(1,'הבעיה שלי'+DD.help('כתבו מה <b>לא עובד היום</b>, לא מה חסר. במקום ״אין מספיק פקחים״ כתבו ״הטיפול בפנייה לוקח יותר מ-14 יום״. אם יש מספר, מצוין.'),'1 מתוך 4')}
      <p class="lead">הבעיה היא <b>מצב שלילי קיים</b>, לא היעדר פתרון. "אין מספיק פקחים" הוא כבר פתרון מחופש לבעיה.</p>
      <textarea id="problem" style="min-height:110px" placeholder="לדוגמה: זמן הטיפול בפניית מפגע חורג מ-14 יום">${E(data.problem)}</textarea>
      <div id="probWarn"></div>`,
    whys:()=>`
      ${head(2,'חמש פעמים "למה"'+DD.help('בכל שורה עונים על ״למה זה קורה?״ לגבי השורה שמעליה. לא חייבים למלא את כל החמש: עוצרים כשמגיעים לסיבה שאפשר לתקן.'),'2 מתוך 4')}
      <p class="lead">שואלים "למה?" שוב ושוב, עד שמגיעים למשהו שאפשר לתקן ולמדוד.</p>
      ${data.whys.map((w,i)=>`<div class="why-row"><span class="lbl">${i===0?'הבעיה':'← למה? '+i}</span><input class="txt" data-why="${i}" placeholder="${E(WHY_PH[i])}" value="${E(w)}"></div>`).join('')}
      <div class="field-label">השורש שאפשר לפעול עליו</div>
      <div class="out" id="root"></div>`,
    template:()=>`
      ${head(3,'התבנית של שאלה עסקית'+DD.help('שאלה עסקית מחברת בין <b>החלטה</b> שמישהו צריך לקבל לבין <b>נתון</b> שיעזור לו. ממלאים חמישה שדות, והמשפט נבנה לבד למטה.'),'3 מתוך 4')}
      <p class="lead">חמישה רכיבים ושאלה אחת. המשפט נבנה בזמן שאתם כותבים.</p>
      <div class="grid2">${FIELDS.map(f=>`<div><div class="field-label" style="margin-top:4px">${f.l}${DD.help(f.h)}</div><input class="txt" data-q="${f.k}" placeholder="${E(f.ph)}" value="${E(data.q[f.k])}"></div>`).join('')}
        <div><div class="field-label" style="margin-top:4px">&nbsp;</div><button class="btn btn-ghost" style="width:100%" onclick="Q.example()">הדוגמה מהמצגת</button></div></div>
      <div class="field-label">השאלה${DD.help('שאלה שקובץ נתונים יכול לענות עליה: כמה, איפה, מתי, כמה זמן. שואלים מה קורה בפועל, לא מה הפתרון.')}</div>
      <textarea data-q="question" placeholder="מה חלוקת עומס הפניות ומשך הטיפול בפועל, לפי אזור וסוג מפגע, ב-12 החודשים האחרונים?">${E(data.q.question)}</textarea>
      <div class="field-label">המשפט המלא</div>
      <div class="out" id="sentence"></div>`,
    tests:()=>`
      ${head(4,'מבחן 5 השאלות'+DD.help('בדיקה מהירה שהשאלה שווה את המאמץ. אם עניתם ״לא״ על אחת השאלות, חוזרים לשלב 3 ומתקנים את הניסוח.'),'4 מתוך 4')}
      <p class="lead">עונים כן או לא. "לא" אחד, וחוזרים לנסח.</p>
      <div class="out" style="font-size:14.5px;margin-bottom:14px">${sentence(true)}</div>
      ${TESTS.map((t,i)=>`
        <div class="check ${data.tests[i]==='y'?'on':data.tests[i]==='n'?'bad':''}">
          <div class="top" style="cursor:default;align-items:center"><div><div class="ttl">${i+1}. ${t.q}</div>${data.tests[i]==='n'?`<div class="q" style="color:#7d2a20">✗ ${t.no}</div>`:''}</div>
            <div class="yn"><button class="y ${data.tests[i]==='y'?'on':''}" onclick="Q.test(${i},'y')">כן</button><button class="n ${data.tests[i]==='n'?'on':''}" onclick="Q.test(${i},'n')">לא</button></div></div>
        </div>`).join('')}
      ${data.tests.includes('n')?'<div class="callout warn">יש "לא". <a href="#" onclick="Q.go(2);return false">חזרה לניסוח השאלה ←</a></div>':''}`,
    done1:()=>`
      <div class="party">
        <div class="big">✓</div>
        <h2>סיימת את החלק הראשון</h2>
        <p>מזל טוב, יש לך שאלה עסקית.</p>
        <div class="out">${plain(sentence(false))}</div>
        <div class="exportbar" style="grid-template-columns:1fr 1fr;margin-top:16px">
          <button class="btn btn-brand" onclick="Q.docQuestion()">הורדה כ-Word</button>
          <button class="btn btn-ghost" onclick="Q.copyQuestion()">העתקה</button>
        </div>
      </div>`,
    kpi:()=>`
      ${head(5,'איך נדע שהצלחנו?'+DD.help('שלוש רמות של הצלחה. <b>תפוקה</b>: מה עשינו (חתמנו על הסכם). <b>תוצאה</b>: מה השתנה בשטח (הטיפול התקצר). <b>השפעה</b>: מה השתנה לתושבים (פחות תלונות). כותבים משפט קצר לכל אחת.'),'חלק 2')}
      <p class="lead">אם נענה על השאלה העסקית ונפעל, איך נדע בעצמנו שזה עבד?</p>
      <div class="three">
        <div><b>תפוקה</b>מה עשינו</div>
        <div><b>תוצאה</b>מה השתנה בשטח</div>
        <div><b>השפעה</b>מה השתנה בחיי התושבים</div>
      </div>
      <div class="field-label">מתי נבדוק?${DD.help('בעוד כמה זמן תעצרו ותבדקו אם זה עבד. בחרו אחת האפשרויות או כתבו תקופה אחרת.')}</div>
      <div class="chips">${PERIODS.map(p=>`<button class="${data.kpi.period===p?'on':''}" onclick="Q.period('${p}')">בעוד ${p}</button>`).join('')}
        <input class="txt" id="periodFree" style="width:170px" placeholder="תקופה אחרת" value="${E(PERIODS.includes(data.kpi.period)?'':data.kpi.period)}"></div>
      ${KPI.map(f=>`<div class="field-label">${f.l}${f.h?DD.help(f.h):''}</div><input class="txt" data-kpi="${f.k}" placeholder="${E(f.ph)}" value="${E(data.kpi[f.k])}">`).join('')}
      <div class="field-label">המשפט שלכם</div>
      <div class="out" id="kpiSentence"></div>`,
    sources:()=>`
      ${head(6,'מפת המקורות'+DD.help('רשימת הנתונים שצריך כדי לענות על השאלה. לכל נתון כותבים מה הוא ואצל מי הוא נמצא, ומדרגים אותו מ-1 (חלש) עד 3 (טוב) בארבעה דברים. הציון הוא הסכום, עד 12.'),'חלק 3')}
      <p class="lead">אילו נתונים צריך, אצל מי הם, ובאיזו איכות. כותבים בשפה חופשית ומדרגים 1–3. <b>8 ומעלה: מתחילים ממנו.</b></p>
      <div class="scroll-x"><table class="tbl srcT">
        <thead><tr><th style="min-width:170px">הנתון, בשפה חופשית</th><th style="min-width:100px">אצל מי</th>${DIMS.map(d=>`<th style="min-width:112px">${d.l}${DD.help(d.h)}</th>`).join('')}<th style="min-width:92px">ציון${DD.help('סכום ארבעת הדירוגים. <b>8 ומעלה</b>: מתחילים מהנתון הזה. <b>6–7</b>: בזהירות. <b>מתחת ל-6</b>: לא בונים עליו החלטה השנה.')}</th><th></th></tr></thead>
        <tbody>${data.sources.map((r,i)=>{const n=srcScore(r),v=srcVerdict(n);return `<tr>
          <td data-label="הנתון"><input data-src="${i}-name" placeholder="${E(SRC_PH[i]||'נתון נוסף')}" value="${E(r.name)}"></td>
          <td data-label="אצל מי"><input data-src="${i}-owner" placeholder="אצל מי?" value="${E(r.owner)}"></td>
          ${DIMS.map(d=>`<td data-label="${d.l}"><select data-src="${i}-${d.k}"><option value="0">—</option>${d.o.map((o,j)=>`<option value="${j+1}" ${r[d.k]===j+1?'selected':''}>${j+1} · ${o}</option>`).join('')}</select></td>`).join('')}
          <td data-label="ציון"><div class="srcsum ${v[0]}">${n||'—'}<div style="font-size:11.5px;font-weight:400">${v[1]}</div></div></td>
          <td class="delcell"><button class="btn btn-ghost btn-sm" onclick="Q.delSrc(${i})" title="מחיקה">✕ מחיקה</button></td></tr>`;}).join('')}</tbody>
      </table></div>
      <button class="btn btn-ghost btn-sm" style="margin-top:10px" onclick="Q.addSrc()">＋ נתון נוסף</button>`,
    export:()=>`
      <div class="party">
        <div class="big">✓</div>
        <h2>הכול מוכן</h2>
        <p>זה המסמך שלכם. שמרו אותו, הוא ישמש אתכם גם בימים הבאים.</p>
        <div class="out" style="margin-bottom:10px"><b>השאלה העסקית</b><br>${plain(sentence(false))}</div>
        <div class="out" style="margin-bottom:10px"><b>איך נדע שהצלחנו</b><br>${plain(kpiSentence(false))}</div>
        <div class="out"><b>מקורות</b><br>${data.sources.filter(r=>r.name.trim()).map(r=>E(r.name)+(r.owner?' ('+E(r.owner)+')':'')+(srcScore(r)?' · '+srcScore(r)+'/12':'')).join('<br>')||'<span style="color:#A3978A">עדיין לא מולאו</span>'}</div>
        <div class="exportbar" style="margin-top:16px">
          <button class="btn btn-brand" onclick="Q.doc()">Word</button>
          <button class="btn btn-ghost" onclick="Q.copyAll()">העתקה</button>
          <button class="btn btn-ghost" onclick="Q.saveJson()">שמירה</button>
          <button class="btn btn-ghost" onclick="Q.loadJson()">טעינה</button>
        </div>
        <div style="margin-top:14px"><button class="btn btn-ghost btn-sm" onclick="Q.reset()">להתחיל מחדש</button></div>
      </div>`
  };
  function head(n,t,of){ return `<div class="stephead"><span class="num">${n}</span><h2>${t}</h2><span class="of">${of}</span></div>`; }

  function render(){
    const st=data.step, key=STEPS[st];
    const btn=(k,label)=>`<button class="stepbtn ${st===k?'on':st>k?'done':''}" onclick="Q.go(${k})" ${st===k?'aria-current="step"':''}><span class="sn">${st>k?'✓':label}</span>${STEP_NAMES[k]}</button>`;
    const parts=PARTS.map((p,i)=>{
      const on=st>=p.from&&st<=p.to;
      const steps = i===0 ? [0,1,2,3].map(k=>btn(k,k+1)).join('') : btn(p.from,i+4);
      return `<div class="part p${i} ${on?'on':''}"><div class="pt">${p.n}${i===0?' · <b>'+p.t+'</b>':''}</div><div class="steps">${steps}</div></div>`;
    }).join('');
    const nextLabel={tests:'סיימתי ←',done1:'ממשיכים לחלק 2: איך נדע שהצלחנו ←',kpi:'ממשיכים לחלק 3: מפת המקורות ←',sources:'סיום וייצוא ←'}[key]||'הבא ←';
    document.getElementById('app').innerHTML=`
      <div class="parts">${parts}</div>
      <div class="panel">${SCREENS[key]()}</div>
      <div class="navrow">
        ${st>0?'<button class="btn btn-ghost" onclick="Q.go('+(st-1)+')">→ הקודם</button>':''}
        ${st<STEPS.length-1?`<button class="btn btn-brand next" onclick="Q.go(${st+1})">${nextLabel}</button>`:''}
      </div>`;
    wire(); paintLive();
  }
  function wire(){
    const on=(sel,fn)=>document.querySelectorAll(sel).forEach(el=>el.addEventListener('input',()=>{fn(el);save();paintLive();}));
    on('#problem',el=>data.problem=el.value);
    on('[data-why]',el=>data.whys[+el.dataset.why]=el.value);
    on('[data-q]',el=>data.q[el.dataset.q]=el.value);
    on('[data-kpi]',el=>data.kpi[el.dataset.kpi]=el.value);
    on('#periodFree',el=>{data.kpi.period=el.value;document.querySelectorAll('.chips button').forEach(b=>b.classList.remove('on'));});
    document.querySelectorAll('[data-src]').forEach(el=>el.addEventListener(el.tagName==='SELECT'?'change':'input',()=>{
      const[i,k]=el.dataset.src.split('-'); data.sources[+i][k]= el.tagName==='SELECT' ? +el.value : el.value; save();
      if(el.tagName==='SELECT') render();
    }));
  }
  function paintLive(){
    const set=(id,html)=>{const el=document.getElementById(id); if(el) el.innerHTML=html;};
    const p=data.problem.trim();
    set('probWarn', p&&SOLUTION_WORDS.test(p) ? '<div class="callout warn">זה נשמע כמו <b>פתרון מחופש לבעיה</b>. נסו לתאר את המצב השלילי שקיים היום, רצוי במספר.</div>' : '');
    set('root', root()?E(root()):'<span style="color:#A3978A">השורש יופיע כאן</span>');
    set('sentence', sentence(true));
    set('kpiSentence', kpiSentence(true));
  }
  function go(n){
    if(STEPS[data.step]==='problem' && !data.whys[0].trim()) data.whys[0]=data.problem;   // the problem opens the "why" chain
    data.step=Math.max(0,Math.min(STEPS.length-1,n)); save(); render(); window.scrollTo({top:0,behavior:'smooth'});
  }
  function test(i,v){ data.tests[i]=data.tests[i]===v?'':v; save(); render(); }
  function period(p){ data.kpi.period=data.kpi.period===p?'':p; save(); render(); }
  function addSrc(){ data.sources.push(newSrc()); save(); render(); }
  function delSrc(i){ data.sources.splice(i,1); if(!data.sources.length) data.sources.push(newSrc()); save(); render(); }
  function example(){
    if(FIELDS.some(f=>data.q[f.k].trim()) && !confirm('להחליף את מה שכתבתם בדוגמה?')) return;
    FIELDS.forEach(f=>data.q[f.k]=f.ph);
    data.q.question='מה חלוקת עומס הפניות ומשך הטיפול בפועל, לפי אזור וסוג מפגע, ב-12 החודשים האחרונים?';
    save(); render();
  }

  /* ---------- export ---------- */
  function textQuestion(){ return 'השאלה העסקית שלי\n'+sentence(false); }
  function asText(){
    const L=['מסמך השאלה העסקית'+(DD.identity()?' · '+DD.identity():''),''];
    L.push('חלק 1 · השאלה העסקית','הבעיה: '+(data.problem||'—'));
    data.whys.forEach((w,i)=>{ if(i>0&&w) L.push(`  למה ${i}: ${w}`); });
    L.push('השורש: '+(root()||'—'),'',sentence(false),'');
    TESTS.forEach((t,i)=>L.push(`  ${data.tests[i]==='y'?'✓':data.tests[i]==='n'?'✗':'☐'} ${t.q}`));
    L.push('','חלק 2 · איך נדע שהצלחנו',kpiSentence(false),'','חלק 3 · מפת המקורות');
    data.sources.filter(r=>r.name.trim()).forEach(r=>{const n=srcScore(r);L.push(`  ${r.name}${r.owner?' (אצל '+r.owner+')':''}${n?': '+n+'/12 · '+srcVerdict(n)[1]:''}`);});
    return L.join('\n');
  }
  function copyQuestion(){ DD.copy(textQuestion(),'השאלה הועתקה ✓'); }
  function docQuestion(){
    DD.downloadDoc('השאלה העסקית שלי','השאלה העסקית','<h1>השאלה העסקית שלי</h1><p>'+E(DD.identity())+'</p><p style="font-size:16px">'+sentence(true)+'</p>');
    DD.toast('המסמך הורד');
  }
  function copyAll(){ DD.copy(asText()); }
  function doc(){
    const h=s=>'<h2>'+E(s)+'</h2>', p=s=>'<p>'+E(s||'—').replace(/\n/g,'<br>')+'</p>';
    let b='<h1>מסמך השאלה העסקית</h1><p>'+E(DD.identity())+'</p>';
    b+=h('חלק 1 · השאלה העסקית')+p('הבעיה: '+data.problem)+'<ol>'+data.whys.slice(1).filter(Boolean).map(w=>'<li>למה? '+E(w)+'</li>').join('')+'</ol>'+p('השורש: '+root());
    b+='<p style="font-size:15px">'+sentence(true)+'</p>';
    b+='<table>'+TESTS.map((t,i)=>'<tr><td>'+E(t.q)+'</td><td>'+(data.tests[i]==='y'?'✓ כן':data.tests[i]==='n'?'✗ לא':'')+'</td></tr>').join('')+'</table>';
    b+=h('חלק 2 · איך נדע שהצלחנו')+'<p style="font-size:15px">'+kpiSentence(true)+'</p>';
    b+=h('חלק 3 · מפת המקורות')+'<table><tr><th>הנתון</th><th>אצל מי</th>'+DIMS.map(d=>'<th>'+d.l+'</th>').join('')+'<th>ציון</th></tr>'+data.sources.filter(r=>r.name.trim()).map(r=>'<tr><td>'+E(r.name)+'</td><td>'+E(r.owner)+'</td>'+DIMS.map(d=>'<td>'+(r[d.k]||'')+'</td>').join('')+'<td>'+(srcScore(r)||'')+' '+(srcScore(r)?srcVerdict(srcScore(r))[1]:'')+'</td></tr>').join('')+'</table>';
    DD.downloadDoc('מסמך השאלה העסקית','מסמך השאלה העסקית',b); DD.toast('המסמך הורד');
  }
  function saveJson(){ DD.download(DD.safeName(data.q.what,'שאלה עסקית')+'.json', JSON.stringify(data,null,2)); }
  function loadJson(){ DD.loadFile(d=>{ data=Object.assign(fresh(),d); save(); render(); }); }
  function reset(){ if(confirm('למחוק את כל מה שמילאתם ולהתחיל מחדש?')){ data=fresh(); save(); render(); } }

  render();
  return {go,test,period,addSrc,delSrc,example,copyQuestion,docQuestion,copyAll,doc,saveJson,loadJson,reset};
})();
</script>
<script src="../../assets/site.js?v=10" data-crumbs='כל ההכשרות|../../;קבלת החלטות מבוססת נתונים|../'></script>
