<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>איתור מקורות מידע ומדדי הצלחה — קבלת החלטות מבוססת נתונים</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alef:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/dd.css?v=27">
<style>
  .wrap{max-width:820px}
  .pagehead{text-align:center;margin:0 0 16px}
  .pagehead h1{font-size:clamp(24px,3vw,30px)}
  .pagehead p{color:var(--ink-soft);margin:4px 0 0;font-size:15.5px}
  .qbox{border:1.5px solid var(--teal,#1f5f5b);background:var(--teal-tint,#dcedea);border-radius:12px;padding:10px 14px;margin-bottom:16px;font-size:15px;line-height:1.6}
  .qbox .ql{font-size:13px;font-weight:700;color:var(--teal,#1f5f5b);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .qbox .ql a{color:var(--teal,#1f5f5b)}
  .qbox.missing{border-color:var(--warning,#9a6514);background:#fbf1e0}
  /* slide 43: metric, starting point, target and date */
  .kpi3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:4px 0 6px}
  .kpi3 .k{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;display:flex;flex-direction:column;gap:6px}
  .kpi3 .k b{font-size:16px}
  .kpi3 .k span{font-size:13px;color:var(--ink-soft)}
  .kpi3 .k .txt{margin-top:2px}
  .kpi3 .mini{font-size:12.5px;color:var(--ink-soft);display:flex;flex-direction:column;gap:3px}
  .kpi3 .pair{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  /* slide 44: output, outcome, impact */
  .levels{display:flex;align-items:stretch;gap:6px;margin:6px 0 4px}
  .levels div{flex:1;border-radius:12px;padding:10px 12px;background:var(--paper);font-size:13.5px;color:var(--ink-soft)}
  .levels div b{display:block;color:var(--ink);font-size:15px}
  .levels div em{font-style:normal;display:block;margin-top:4px;color:var(--brand-deep);font-weight:700}
  .levels div.main{background:var(--teal-tint,#dcedea);outline:2px solid var(--teal,#1f5f5b)}
  .levels i{font-style:normal;align-self:center;color:#c4b49a;font-weight:700}
  .exrow{margin:12px 0 0}
  .stephead{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .stephead .num{width:34px;height:34px;border-radius:10px;background:var(--brand);color:#FFFDF8;display:grid;place-items:center;font-size:17px;font-weight:700;flex:0 0 auto}
  .stephead h2{font-size:21px;letter-spacing:-.3px;display:flex;align-items:center}
  .hasfile{display:flex;gap:6px;flex-wrap:wrap}
  .hasfile button{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 16px;font:700 14.5px var(--font-sans,Arial);color:var(--ink-soft);cursor:pointer}
  .hasfile button.on{border-color:var(--teal,#1f5f5b);background:var(--teal,#1f5f5b);color:#fff}
  .eg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .eg button{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px;font-weight:700;font-size:13.5px;color:var(--teal,#1f5f5b);cursor:pointer}
  .eg button:hover{border-color:var(--teal,#1f5f5b)}
  .panel textarea{width:100%;min-height:70px}
  .sub{font-size:15px;font-weight:700;margin:14px 0 6px}
  .nextcta{display:flex;margin:18px auto 0;max-width:420px;padding:15px 22px;font-size:17px}
  @media (max-width:640px){.kpi3{grid-template-columns:1fr}.levels{flex-direction:column}.levels i{display:none}}
</style>
<link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="../../assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../../assets/apple-touch-icon.png">
<link rel="stylesheet" href="../../assets/site.css?v=27">
</head>
<body>
  <header class="bar">
    <div class="brand">איתור מקורות מידע ומדדי הצלחה</div>
    <a class="hublink" href="../">‹ כל הכלים</a>
  </header>

  <main class="wrap" id="app"></main>

  <footer class="credit"><span>נבנה ע"י רומן גרינשטיין</span></footer>
  <div class="toast" id="toast"></div>

<script src="../assets/dd.js?v=27"></script>
<script>
const K=(()=>{
  'use strict';
  /* Follows slides 38–45 of the day-1 deck: where the data might be, then the KPI. Saved next to the challenge (dd_question_v3.ideas / .kpi),
     so the builder, this tool and the AI prompt share one record. */
  const LS='dd_question_v3', E=DD.esc;
  /* slides 39–40: three directions, with the deck's example */
  /* a first look only: is there a file at all, and where might it be. The full map is tool 5. */
  const PLACES=['מוקד ופניות','ארנונה וגבייה','רישוי עסקים','הנדסה ו-GIS','חינוך','רווחה וקהילה','קבצי אקסל באגף','אתר ציבורי (הלמ״ס, data.gov.il)'];
  const HAS=[['yes','כן, יש קובץ'],['unsure','לא בטוח'],['no','עוד אין']];
  const IDEAS_EX='ארנונה: מי פעיל ומי נסגר\nרישוי עסקים\nפניות למוקד 106';
  const IEMPTY={internal:'',open:'',field:'',hasFile:''};
  const EMPTY={metric:'',base:'',target:'',date:'',output:''};
  let rec=DD.load(LS,{});
  rec.kpi=Object.assign({},EMPTY,rec.kpi||{});
  rec.ideas=Object.assign({},IEMPTY,rec.ideas||{});
  const k=()=>rec.kpi;
  function save(){ const cur=DD.load(LS,{}); cur.kpi=rec.kpi; cur.ideas=rec.ideas; DD.save(LS,cur); }
  const hasIdeas=()=>!!(rec.ideas.internal||'').trim();   // keep whatever the builder saved meanwhile

  const slot=html=>(v,ph)=>{ v=(v||'').trim(); return html ? `<span class="slot ${v?'':'empty'}">${E(v||ph)}</span>` : (v||'['+ph+']'); };
  function sentence(html){
    const s=slot(html);
    return `נדע שהצלחנו כאשר ${s(k().metric,'מדד')} ישתנה מ-${s(k().base,'נקודת מוצא')} ל-${s(k().target,'יעד')} עד ${s(k().date,'מועד')}.`
      ;
  }
  const LABELS={metric:'מדד',base:'נקודת מוצא',target:'יעד',date:'מועד',output:'מדד תפוקה'};
  const input=f=>`<input class="txt" data-k="${f}" aria-label="${LABELS[f]}" value="${E(k()[f])}">`;

  function render(){
    const q=DD.businessQuestion();
    document.getElementById('app').innerHTML=`
      <div class="pagehead"><h1>איתור מקורות מידע ומדדי הצלחה</h1></div>
      <div class="qbox ${q?'':'missing'}">${q
        ? `<div class="ql"><span>האתגר משולחן העבודה שלכם</span><a href="../question/">לעריכה ←</a></div>${E(q)}`
        : `<div class="ql"><span>עדיין אין אתגר משולחן העבודה</span><a href="../question/">לבונה האתגר ←</a></div>אפשר להמשיך גם בלי, אבל קל יותר כשהאתגר מול העיניים.`}</div>

      <div class="panel">
        <div class="stephead"><span class="num">1</span><h2>איפה יכול להיות המידע?${DD.help('מיפוי ראשוני בלבד: יש קובץ בכלל, ואיפה הוא עשוי להיות. המיפוי המלא נעשה בכלי <b>מיפוי מקורות המידע</b>.')}</h2></div>
        <div class="field-label" style="margin-top:0">יש לכם כבר קובץ נתונים על האתגר?</div>
        <div class="hasfile">${HAS.map(h=>`<button type="button" class="${rec.ideas.hasFile===h[0]?'on':''}" aria-pressed="${rec.ideas.hasFile===h[0]}" onclick="K.has('${h[0]}')">${h[1]}</button>`).join('')}</div>
        <div class="field-label">איפה נראה לכם שיש קובץ נתונים?</div>
        <div class="eg">${PLACES.map(x=>`<button type="button" onclick="K.idea('${x}')">+ ${x}</button>`).join('')}</div>
        <textarea data-idea="internal" aria-label="איפה נראה לכם שיש קובץ נתונים">${E(rec.ideas.internal)}</textarea>
        <div class="exrow"><button class="btn btn-ghost btn-sm" onclick="K.ideasExample()">הדוגמה מהמצגת</button></div>
      </div>

      <div class="panel">
        <div class="stephead"><span class="num">2</span><h2>איך נדע שהצלחנו? (KPI)${DD.help('<b>KPI</b> = Key Performance Indicator, מדד ביצוע מרכזי. הצלחה היא מספר, לא תחושה: מדד אחד שאפשר לספור, המספר של היום, ולאן רוצים להגיע ועד מתי.')}</h2></div>
        <div class="out" id="sentence" style="margin:0 0 12px"></div>
        <div class="kpi3">
          <div class="k"><b>מדד</b><span>מה בדיוק סופרים</span>${input('metric')}</div>
          <div class="k"><b>נקודת מוצא</b><span>איפה אנחנו היום</span>${input('base')}</div>
          <div class="k"><b>יעד ומועד</b><span>לאן ועד מתי</span><div class="pair"><label class="mini">יעד${input('target')}</label><label class="mini">מועד${input('date')}</label></div></div>
        </div>
        <div class="sub">תפוקה · תוצאה · השפעה</div>
        <div class="levels">
          <div><b>תפוקה</b>כמה עשינו?<em>50 סדנאות לבעלי עסקים</em></div><i aria-hidden="true">←</i>
          <div class="main"><b>תוצאה</b>מה השתנה בשטח?<em>פחות עסקים נסגרים</em></div><i aria-hidden="true">←</i>
          <div><b>השפעה</b>האם המצב באמת טוב יותר?<em>מרכז מסחרי חי ותוסס</em></div>
        </div>
      </div>

      <div class="panel">
        <div class="exportbar" style="grid-template-columns:1fr 1fr;margin-top:12px">
          <button class="btn btn-ghost" onclick="K.doc()">ייצוא ל-Word</button>
          <button class="btn btn-ghost" onclick="K.copyText()">העתקה</button>
        </div>
      </div>
      <a class="btn btn-brand nextcta" href="../ai-prompt/">ממשיכים: מתייעצים עם ה-AI ←</a>`;
    document.querySelectorAll('[data-idea]').forEach(el=>el.addEventListener('input',()=>{ rec.ideas[el.dataset.idea]=el.value; save(); }));
    document.querySelectorAll('[data-k]').forEach(el=>el.addEventListener('input',()=>{ k()[el.dataset.k]=el.value; save(); paint(); }));
    paint();
  }
  function paint(){ document.getElementById('sentence').innerHTML=sentence(true); }
  /* tapping an example adds it as a line, so nobody starts from an empty box */
  function idea(x){ const cur=(rec.ideas.internal||'').trim(); if(cur.split(/\n/).includes(x)) return; rec.ideas.internal=cur?cur+'\n'+x:x; save(); render(); }
  function has(v){ rec.ideas.hasFile=rec.ideas.hasFile===v?'':v; save(); render(); }
  function ideasExample(){
    if(hasIdeas() && !confirm('להחליף את מה שכתבתם בדוגמה?')) return;
    rec.ideas.internal=IDEAS_EX; save(); render();
  }
  function text(){
    const q=DD.businessQuestion(), x=k();
    const hf=(HAS.find(h=>h[0]===rec.ideas.hasFile)||[])[1], where=(rec.ideas.internal||'').trim().replace(/\n+/g,' · ');
    const ideas=[hf?'יש קובץ נתונים? '+hf:'', where?'איפה: '+where:''].filter(Boolean);
    return ['איתור מקורות מידע ומדדי הצלחה'+(DD.identity()?' · '+DD.identity():''),'',
      q?'האתגר משולחן העבודה: '+q:'', '',
      ideas.length?'איפה יכול להיות המידע:':'', ...ideas, '',
      'איך נדע שהצלחנו (KPI):',
      'מדד: '+(x.metric||'—'),'נקודת מוצא: '+(x.base||'—'),'יעד: '+(x.target||'—')+' עד '+(x.date||'—'),
      '',sentence(false)].filter((l,i,a)=>l!==''||a[i-1]!=='').join('\n');
  }
  function copyText(){ DD.copy(text(),'הועתק ✓'); }
  function doc(){
    const q=DD.businessQuestion(), x=k();
    let b='<h1>איתור מקורות מידע ומדדי הצלחה</h1><p>'+E(DD.identity())+'</p>';
    if(q) b+='<p><b>האתגר משולחן העבודה:</b> '+E(q)+'</p>';
    b+='<h2>איפה יכול להיות המידע</h2><table><tr><th>יש קובץ נתונים?</th><td>'+E((HAS.find(h=>h[0]===rec.ideas.hasFile)||['',''])[1])+'</td></tr><tr><th>איפה</th><td>'+E((rec.ideas.internal||'').trim()).replace(/\n/g,'<br>')+'</td></tr></table><p>מיפוי מעמיק של המקורות: בכלי ״מיפוי מקורות המידע״.</p>';
    b+='<h2>איך נדע שהצלחנו (KPI)</h2>';
    b+='<table><tr><th>מדד</th><td>'+E(x.metric)+'</td></tr><tr><th>נקודת מוצא</th><td>'+E(x.base)+'</td></tr><tr><th>יעד</th><td>'+E(x.target)+'</td></tr><tr><th>מועד</th><td>'+E(x.date)+'</td></tr>'+'</table>';
    b+='<p style="font-size:15px">'+E(sentence(false))+'</p>';
    DD.downloadDoc('מקורות מידע ומדדי הצלחה','איתור מקורות מידע ומדדי הצלחה',b); DD.toast('המסמך הורד');
  }
  render();
  return {idea,has,ideasExample,copyText,doc};
})();
</script>
<script src="../../assets/site.js?v=27" data-crumbs='כל ההכשרות|../../;קבלת החלטות מבוססת נתונים|../'></script>
</body>
</html>
