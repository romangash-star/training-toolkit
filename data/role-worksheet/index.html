<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מה אני עושה ברשות? — קבלת החלטות מבוססת נתונים</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alef:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--canvas:#EEF1F6;--paper:#F7F9FB;--card:#FFF;--ink:#15242E;--ink-soft:#54636F;--line:#D5DBE3;--brand:#127C71;--brand-deep:#0E655C;--root:#C77D3E;--coral:#D9534F;--leaf:#2E8B6B;--core-1:#1F5673;--sans:'Alef','Segoe UI',Arial,sans-serif;--shadow:0 10px 30px rgba(21,36,46,.12);--shadow-sm:0 3px 12px rgba(21,36,46,.08)}
  *{box-sizing:border-box} html,body{margin:0;min-height:100%}
  body{font-family:var(--sans);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;background:var(--canvas);background-image:radial-gradient(1100px 520px at 78% -8%,rgba(18,124,113,.10),transparent 60%),radial-gradient(900px 480px at 10% 6%,rgba(31,86,115,.09),transparent 60%);display:flex;flex-direction:column;min-height:100vh}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit} textarea,input{font-family:inherit}
  h1,h2,h3,h4{font-weight:700;line-height:1.15;margin:0} a{color:var(--brand-deep)}
  header.bar{display:flex;align-items:center;gap:16px;padding:12px 22px;background:rgba(247,249,251,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
  .brand{display:flex;align-items:center;gap:11px;font-weight:700;font-size:18px;letter-spacing:-.4px}
  .brand .mark{width:28px;height:28px}
  .daytag{font-size:12px;font-weight:700;color:#fff;background:var(--core-1);padding:3px 10px;border-radius:999px}
  .hublink{margin-inline-start:auto;font-size:14px;font-weight:700;color:var(--ink-soft);text-decoration:none;border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:10px}
  .hublink:hover{color:var(--ink);border-color:#b3bdc9}
  .btn{padding:10px 16px;border-radius:11px;font-weight:700;font-size:14px;transition:.15s;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px}
  .btn-brand{background:linear-gradient(135deg,var(--brand),var(--brand-deep));color:#fff;box-shadow:0 4px 14px rgba(18,124,113,.28)}.btn-brand:hover{background:var(--brand-deep)}
  .btn-ghost{color:var(--ink-soft);border:1px solid var(--line);background:#fff}.btn-ghost:hover{color:var(--ink);border-color:#b3bdc9}
  .btn-dark{background:var(--ink);color:#fff}.btn-dark:hover{background:#0c1820}
  .wrap{flex:1;width:100%;max-width:920px;margin:0 auto;padding:22px 20px 56px}

  .top{display:flex;align-items:center;gap:20px;flex-wrap:wrap-reverse;justify-content:space-between;margin-bottom:8px}
  .top .titles{text-align:right}
  .pill{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--brand-deep);background:#E7F1EE;border-radius:999px;padding:4px 12px}
  .pill .dot{width:8px;height:8px;border-radius:50%;background:var(--coral)}
  .top h1{font-size:clamp(28px,4.4vw,37px);letter-spacing:-1px;margin-top:8px}
  .top p{color:var(--ink-soft);font-size:14.5px;max-width:520px;margin:8px 0 0}

  /* timer card */
  .timer{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-sm);padding:14px 16px;display:flex;align-items:center;gap:14px}
  .timer .presets{display:flex;flex-direction:column;gap:6px}
  .timer .presets button{width:38px;height:30px;border-radius:9px;background:#EEF1F6;font-weight:700;font-size:14px;color:var(--ink-soft)}
  .timer .presets button.on{background:var(--brand);color:#fff}
  .timer .clock{font-size:44px;font-weight:700;letter-spacing:1px;font-variant-numeric:tabular-nums;min-width:118px;text-align:center}
  .timer .clock.warn{color:var(--root)} .timer .clock.over{color:var(--coral)}
  .timer .ctrl{display:flex;flex-direction:column;gap:6px}
  .timer .ctrl .go{background:var(--brand);color:#fff;border-radius:9px;padding:8px 14px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
  .timer .ctrl .go:hover{background:var(--brand-deep)}
  .timer .ctrl .rst{background:#EEF1F6;border-radius:9px;padding:8px;font-size:15px;color:var(--ink-soft)}

  .intro{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 15px;font-size:14px;color:var(--ink-soft);margin:16px 0}
  .intro b{color:var(--ink)}

  .sec{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow-sm);margin-bottom:14px}
  .sec .sh{display:flex;align-items:center;gap:9px;margin-bottom:4px}
  .sec .num{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;flex:0 0 auto;box-shadow:var(--shadow-sm)}
  .sec.s1 .num{background:var(--leaf)} .sec.s2 .num{background:var(--brand)} .sec.s3 .num{background:var(--coral)}
  .sec h3{font-size:16px}
  .sec .ex{font-size:12.5px;color:var(--ink-soft);background:var(--paper);border-radius:8px;padding:2px 9px;display:inline-block;margin:2px 0 12px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}

  .in-wrap{position:relative}
  input.txt{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:11px 13px;font-size:14.5px;background:#fff;color:var(--ink)}
  input.txt:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(18,124,113,.14)}
  .in-wrap.micwrap input{padding-inline-start:44px}
  .mic{position:absolute;inset-inline-start:7px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:8px;background:#fff;border:1px solid var(--line);color:var(--brand-deep);display:grid;place-items:center}
  .mic:hover{border-color:var(--brand);background:#f0faf8}
  .mic.rec{background:#E4463A;border-color:#E4463A;color:#fff;animation:pulse 1.1s ease-out infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(228,70,58,.5)}100%{box-shadow:0 0 0 12px rgba(228,70,58,0)}}

  .items{display:flex;flex-direction:column;gap:8px;margin-top:10px}
  .item{display:flex;align-items:center;gap:7px}
  .item input.txt{flex:1;padding:9px 11px;font-size:14px}
  .item .aibtn{flex:0 0 auto;width:34px;height:34px;border-radius:9px;border:1.5px solid var(--line);background:#fff;font-size:15px;display:grid;place-items:center;transition:.12s}
  .item .aibtn.on{background:#EAF0F5;border-color:var(--core-1);box-shadow:0 0 0 2px rgba(31,86,115,.12)}
  .item .del{flex:0 0 auto;width:30px;height:34px;border-radius:9px;background:#fff;border:1px solid var(--line);color:#B23A2C;font-weight:700}
  .addbtn{margin-top:10px;font-size:13.5px;font-weight:700;color:var(--brand-deep);border:1.5px dashed var(--line);border-radius:10px;padding:9px;width:100%;background:#fff}
  .addbtn:hover{border-color:var(--brand);background:#f0faf8}
  .aihint{font-size:12px;color:var(--ink-soft);margin-top:9px;display:flex;align-items:center;gap:6px}

  .exportbar{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:18px}
  .exportbar .btn{width:100%}
  .cloud{margin-top:14px;border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--paper)}
  .cloud h4{font-size:14px;display:flex;align-items:center;gap:7px}
  .cloud .row{display:flex;gap:8px;margin-top:10px}.cloud .row input{flex:1}
  .hint{font-size:12.5px;color:var(--ink-soft)}

  footer.credit{display:flex;align-items:center;justify-content:center;gap:11px;padding:14px 22px;text-align:center;font-size:13px;color:var(--ink-soft);background:rgba(247,249,251,.9);border-top:1px solid var(--line)}
  footer.credit .credit-ava{width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid #fff;box-shadow:var(--shadow-sm)}
  footer.credit a{color:var(--brand-deep);font-weight:700;text-decoration:none}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 22px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:100;box-shadow:var(--shadow)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (max-width:640px){.cols{grid-template-columns:1fr}.exportbar{grid-template-columns:1fr 1fr}}
  @media (prefers-reduced-motion:reduce){.mic.rec{animation:none}.toast{transition:none}}
</style>
</head>
<body>
  <header class="bar">
    <div class="brand"><svg class="mark" viewBox="0 0 24 24" fill="none"><rect x="4" y="3" width="16" height="18" rx="2.5" stroke="#127C71" stroke-width="2"/><path d="M8 8h8M8 12h8M8 16h5" stroke="#C77D3E" stroke-width="2" stroke-linecap="round"/></svg>דף עבודה אישי</div>
    <span class="daytag">יום 1 · שאלה</span>
    <a class='hublink' href='../' id='hubLink'>‹ כל הכלים</a>
  </header>

  <main class="wrap" id="app"></main>

  <footer class="credit"><img class="credit-ava" src="../../assets/roman.jpg" alt="רומן גרנשטיין"><span>נבנה ע"י רומן גרנשטיין · <a href="mailto:romangash@gmail.com">romangash@gmail.com</a></span></footer>
  <input type="file" id="fileIn" accept="application/json,.json" style="display:none">
  <div class="toast" id="toast"></div>

<script>
const App=(()=>{
  'use strict';
  const LS='dd_role_worksheet_v1', PADLET_KEY='toolkit_padlet_url';
  const DEFAULT_PADLET='https://padlet.com/romangash/padlet-emxukhiqh96z99bl';
  const PRESETS=[7,5,3];
  let uid=1; function nid(){return 'n'+(uid++);}
  let data=fresh();
  let timer={total:300,remain:300,running:false,id:null};

  function fresh(){ return {meta:{author:''}, role:'', big:[{id:nid(),text:'',ai:false}], daily:[{id:nid(),text:'',ai:false}]}; }
  function persist(){ try{localStorage.setItem(LS,JSON.stringify(data));}catch(e){} }
  function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function attr(s){return esc(s).replace(/"/g,'&quot;');}

  function setHub(){}
  function init(){ setHub(); try{const s=JSON.parse(localStorage.getItem(LS)); if(s&&s.big)data=s;}catch(e){} document.getElementById('fileIn').addEventListener('change',onFile); render(); }
  function onFile(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{data=JSON.parse(r.result);render();toast('נטען');}catch(err){toast('קובץ לא תקין');}};r.readAsText(f);e.target.value='';}
  function fmt(s){s=Math.max(0,s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}

  function listHTML(arr,key){
    const items=arr.map(it=>`<div class="item">
      <input class="txt" data-t="${key}:${it.id}" placeholder="הוסיפו משימה…" value="${attr(it.text)}">
      <button class="aibtn ${it.ai?'on':''}" title="AI יכול לחסוך זמן כאן" onclick="App.toggleAi('${key}','${it.id}')">🤖</button>
      <button class="del" title="מחיקה" onclick="App.del('${key}','${it.id}')">×</button>
    </div>`).join('');
    return `<div class="items">${items}</div><button class="addbtn" onclick="App.add('${key}')">+ הוספת שורה</button>`;
  }

  function render(){
    const padletUrl=(()=>{try{return localStorage.getItem(PADLET_KEY)||DEFAULT_PADLET}catch(e){return DEFAULT_PADLET}})();
    const c=(timer.remain<=10&&timer.remain>0)?' warn':(timer.remain<=0?' over':'');
    document.getElementById('app').innerHTML=`
      <div class="top">
        <div class="timer">
          <div class="presets">${PRESETS.map(m=>`<button class="${timer.total===m*60?'on':''}" onclick="App.preset(${m})">${m}</button>`).join('')}</div>
          <div class="clock${c}" id="clock">${fmt(timer.remain)}</div>
          <div class="ctrl">
            <button class="go" id="startBtn" onclick="App.toggleTimer()">${timer.running?'⏸ השהה':'▶ התחל'}</button>
            <button class="rst" onclick="App.resetTimer()" title="איפוס">↺</button>
          </div>
        </div>
        <div class="titles">
          <span class="pill"><span class="dot"></span>דף עבודה אישי · ממלאים לבד</span>
          <h1>מה אני עושה ברשות?</h1>
          <p>מפו לעצמכם שלושה דברים — לכל אחד יש דוגמה שתעזור להתחיל. לאורך היום נחזור לרשימה ונחפש איפה AI יחסוך לכם זמן.</p>
        </div>
      </div>

      <div class="sec s1">
        <div class="sh"><span class="num">1</span><h3>מה התפקיד שלי ברשות?</h3></div>
        <span class="ex">דוגמה: רכזת פניות ותושבים באגף שירות</span>
        <div class="in-wrap micwrap"><input class="txt" id="role" data-t="role" placeholder="כתבו את התפקיד שלכם…" value="${attr(data.role)}"><button class="mic" data-t="role">🎤</button></div>
      </div>

      <div class="cols">
        <div class="sec s2">
          <div class="sh"><span class="num">2</span><h3>משימות גדולות ומשמעותיות</h3></div>
          <span class="ex">דוגמה: הכנת דוח שנתי לאגף</span>
          ${listHTML(data.big,'big')}
        </div>
        <div class="sec s3">
          <div class="sh"><span class="num">3</span><h3>משימות יומיומיות וחזרתיות</h3></div>
          <span class="ex">דוגמה: מענה לפניות חוזרות של תושבים</span>
          ${listHTML(data.daily,'daily')}
        </div>
      </div>
      <div class="aihint">🤖 לחצו על סמל ה‑AI ליד משימה שבה נראה לכם ש‑AI יכול לחסוך זמן — נחזור לזה בהמשך.</div>

      <div class="exportbar">
        <button class="btn btn-brand" onclick="App.exportPNG()">⬇️ תמונה</button>
        <button class="btn btn-ghost" onclick="App.copyText()">📋 העתקה</button>
        <button class="btn btn-ghost" onclick="App.saveFile()">💾 שמירה</button>
        <button class="btn btn-ghost" onclick="document.getElementById('fileIn').click()">📂 טעינה</button>
      </div>
      <div class="cloud">
          <h4>📌 הלוח המשותף (Padlet)</h4>
          <a href="https://padlet.com/romangash/padlet-emxukhiqh96z99bl" target="_blank" rel="noopener" class="btn btn-dark" style="margin-top:10px;width:100%;text-decoration:none">↗ פתיחת הלוח</a>
          <div class="hint" style="margin-top:10px;line-height:1.75"><b>איך מעלים ללוח:</b><br>1. לוחצים על <b>⬇️ תמונה</b> — התמונה נשמרת במחשב.<br>2. לוחצים על <b>פתיחת הלוח</b> למעלה.<br>3. בלוח לוחצים על כפתור <b>+</b> (הוספת פוסט).<br>4. גוררים את התמונה לפוסט, או לוחצים על סמל התמונה ובוחרים אותה.<br>5. לוחצים <b>פרסום</b>. זהו!</div>
        </div>`;
    wire();
  }

  function wire(){
    const role=document.getElementById('role'); if(role)role.addEventListener('input',()=>{data.role=role.value;persist();});
    document.querySelectorAll('[data-t]').forEach(el=>{ const t=el.dataset.t; if(t==='role')return; el.addEventListener('input',()=>{ const [k,id]=t.split(':'); const it=data[k].find(x=>x.id===id); if(it){it.text=el.value;persist();} }); });
    const pu=document.getElementById('padletUrl'); if(pu)pu.addEventListener('input',e=>{try{localStorage.setItem(PADLET_KEY,e.target.value.trim());}catch(e){}});
    document.querySelectorAll('.mic').forEach(b=>b.addEventListener('click',()=>dictate(document.querySelector(`[data-t="${b.dataset.t}"]`),b)));
  }
  function add(k){ data[k].push({id:nid(),text:'',ai:false}); persist(); render(); }
  function del(k,id){ data[k]=data[k].filter(x=>x.id!==id); if(!data[k].length)data[k].push({id:nid(),text:'',ai:false}); persist(); render(); }
  function toggleAi(k,id){ const it=data[k].find(x=>x.id===id); if(it){it.ai=!it.ai;persist();render();} }

  /* timer */
  function preset(m){ timer.total=m*60; timer.remain=m*60; stopTimer(); paint(); }
  function toggleTimer(){ if(timer.running){ stopTimer(); } else { if(timer.remain<=0)timer.remain=timer.total; timer.running=true; beep(660,.08); timer.id=setInterval(()=>{ timer.remain--; if(timer.remain<=0){ stopTimer(); beep(440,.4); vibrate([120,80,120]); } paint(); },1000); } paintBtn(); }
  function stopTimer(){ clearInterval(timer.id); timer.running=false; paintBtn(); }
  function resetTimer(){ stopTimer(); timer.remain=timer.total; paint(); }
  function paint(){ const cl=document.getElementById('clock'); if(!cl)return; cl.textContent=fmt(timer.remain); cl.className='clock'+((timer.remain<=10&&timer.remain>0)?' warn':(timer.remain<=0?' over':'')); }
  function paintBtn(){ const b=document.getElementById('startBtn'); if(b)b.innerHTML=timer.running?'⏸ השהה':(timer.remain<timer.total&&timer.remain>0?'▶ המשך':'▶ התחל'); }
  let actx; function beep(f,d){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); const o=actx.createOscillator(),g=actx.createGain(); o.frequency.value=f; o.connect(g); g.connect(actx.destination); g.gain.setValueAtTime(.18,actx.currentTime); g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d); o.start(); o.stop(actx.currentTime+d);}catch(e){} }
  function vibrate(p){ try{navigator.vibrate&&navigator.vibrate(p);}catch(e){} }

  /* dictation */
  let recog=null;
  function dictate(el,btn){if(!el)return;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('הכתבה קולית נתמכת ב‑Chrome / Edge');return;}if(recog){recog.stop();return;}recog=new SR();recog.lang='he-IL';recog.interimResults=true;recog.continuous=false;const base=(el.value||'').trim();btn.classList.add('rec');recog.onresult=(e)=>{let f='',i='';for(let k=0;k<e.results.length;k++){const r=e.results[k];if(r.isFinal)f+=r[0].transcript;else i+=r[0].transcript;}el.value=(base?base+' ':'')+(f+i).trim();el.dispatchEvent(new Event('input',{bubbles:true}));};recog.onend=()=>{btn.classList.remove('rec');recog=null;el.focus();};recog.onerror=()=>{btn.classList.remove('rec');recog=null;};try{recog.start();toast('מקשיב…');}catch(e){btn.classList.remove('rec');recog=null;}}

  /* export */
  function identity(){
    try{ var s=JSON.parse(localStorage.getItem('toolkit_identity')||'{}');
      return [s.name,s.dept,s.role].filter(Boolean).join(' · ');
    }catch(e){ return ''; }
  }
  function fileName(x){return 'מה-אני-עושה-ברשות.'+x;}
  let mc;function measure(){if(!mc)mc=document.createElement('canvas').getContext('2d');return mc;}
  function wrapLines(t,w,f){const c=measure();c.font=f;const words=(t||'').split(/\s+/).filter(Boolean);if(!words.length)return[''];const L=[];let cur=words[0];for(let i=1;i<words.length;i++){const x=cur+' '+words[i];if(c.measureText(x).width<=w)cur=x;else{L.push(cur);cur=words[i];}}L.push(cur);return L;}
  function drawDoc(scale){
    const W=800,PAD=40,cw=W-PAD*2,F='Alef, sans-serif';
    const blk=[];
    blk.push({t:'h',x:'התפקיד שלי','c':'#2E8B6B'}); wrapLines(data.role||'—',cw-16,`400 15px ${F}`).forEach(l=>blk.push({t:'p',x:l}));
    blk.push({t:'h',x:'משימות גדולות ומשמעותיות','c':'#127C71'});
    const big=data.big.filter(x=>x.text.trim()); (big.length?big:[{text:'—',ai:false}]).forEach(x=>wrapLines((x.ai?'🤖 ':'• ')+x.text,cw-16,`400 14px ${F}`).forEach(l=>blk.push({t:'p',x:l})));
    blk.push({t:'h',x:'משימות יומיומיות וחזרתיות','c':'#D9534F'});
    const dl=data.daily.filter(x=>x.text.trim()); (dl.length?dl:[{text:'—',ai:false}]).forEach(x=>wrapLines((x.ai?'🤖 ':'• ')+x.text,cw-16,`400 14px ${F}`).forEach(l=>blk.push({t:'p',x:l})));
    const headerH=80,footerH=40;let y=headerH+22;blk.forEach(b=>{y+=b.t==='h'?32:22;});const Ht=y+footerH+16;
    const cv=document.createElement('canvas');cv.width=W*scale;cv.height=Ht*scale;const x=cv.getContext('2d');x.scale(scale,scale);
    x.fillStyle='#f6f8fb';x.fillRect(0,0,W,Ht);x.fillStyle='#123047';x.fillRect(0,0,W,headerH);
    x.direction='rtl';x.textBaseline='middle';x.fillStyle='#fff';x.textAlign='right';x.font=`700 24px ${F}`;x.fillText('מה אני עושה ברשות?',W-PAD,32);
    x.font=`400 14px ${F}`;x.fillStyle='rgba(255,255,255,.8)';var __s=[identity(),data.meta.author].filter(Boolean).join(' · ');if(__s)x.fillText(__s,W-PAD,58);
    x.textAlign='left';x.font=`700 12px ${F}`;x.fillStyle='rgba(255,255,255,.7)';x.fillText('דף עבודה אישי · הכשרת AI',PAD,40);
    y=headerH+22;
    blk.forEach(b=>{if(b.t==='h'){x.textAlign='right';x.fillStyle=b.c;x.font=`700 17px ${F}`;x.beginPath();x.arc(W-PAD-5,y,5,0,7);x.fill();x.fillText('   '+b.x,W-PAD,y);y+=32;}else{x.textAlign='right';x.fillStyle='#1f3540';x.font=`400 15px ${F}`;x.fillText(b.x,W-PAD,y);y+=22;}});
    x.textAlign='center';x.fillStyle='#54636F';x.font=`400 12px ${F}`;x.fillText('נבנה ע"י רומן גרנשטיין · romangash@gmail.com',W/2,Ht-footerH/2);
    return cv;
  }
  function exportPNG(){try{drawDoc(2).toBlob(b=>{const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=fileName('png');a.click();setTimeout(()=>URL.revokeObjectURL(u),1500);toast('התמונה הורדה');},'image/png');}catch(e){toast('שגיאה');}}
  function copyText(){let t=`מה אני עושה ברשות?\n\n■ התפקיד:\n${data.role||'—'}\n\n■ משימות גדולות ומשמעותיות:\n`+(data.big.filter(x=>x.text.trim()).map(x=>`${x.ai?'🤖 ':'• '}${x.text}`).join('\n')||'—')+`\n\n■ משימות יומיומיות וחזרתיות:\n`+(data.daily.filter(x=>x.text.trim()).map(x=>`${x.ai?'🤖 ':'• '}${x.text}`).join('\n')||'—')+`\n\n(🤖 = מקום שבו AI יכול לחסוך זמן)\n— נבנה ע"י רומן גרנשטיין`;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('הועתק ✓')).catch(()=>prompt('העתיקו:',t));}
  function saveFile(){const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=fileName('json');a.click();setTimeout(()=>URL.revokeObjectURL(u),1500);toast('נשמר');}
  function makeBlob(){
    return new Promise(function(res,rej){
      try{ drawDoc(2).toBlob(function(b){ b?res(b):rej(new Error('blob')); },'image/png'); }
      catch(e){ rej(e); }
    });
  }
  function downloadBlob(bl){
    var u=URL.createObjectURL(bl); var a=document.createElement('a');
    a.href=u; a.download=fileName('png'); document.body.appendChild(a); a.click();
    setTimeout(function(){ try{document.body.removeChild(a);}catch(e){} URL.revokeObjectURL(u); },1500);
  }
  function sharePadlet(){
    var padlet='';
    try{ padlet=localStorage.getItem(PADLET_KEY)||''; }catch(e){}
    var inp=document.getElementById('padletUrl');
    if(inp&&inp.value&&inp.value.trim()) padlet=inp.value.trim();
    if(!padlet) padlet=DEFAULT_PADLET;

    // 1) נייד: שיתוף ישיר לאפליקציית Padlet
    var isMobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    if(isMobile && navigator.canShare && navigator.share){
      makeBlob().then(function(bl){
        var file=new File([bl],fileName('png'),{type:'image/png'});
        if(navigator.canShare({files:[file]})){
          navigator.share({files:[file],title:'מה אני עושה ברשות?'}).catch(function(){
            downloadBlob(bl); try{window.open(padlet,'_blank','noopener');}catch(e){}
            toast('התמונה הורדה — העלו אותה ללוח');
          });
        } else { downloadBlob(bl); try{window.open(padlet,'_blank','noopener');}catch(e){} }
      }).catch(function(){ toast('שגיאה ביצירת התמונה'); });
      return;
    }

    // 2) מחשב: מעתיקים את התמונה ללוח ההעתקה ופותחים את Padlet
    var win=null;
    try{ win=window.open(padlet,'_blank','noopener'); }catch(e){}
    var canClip = !!(window.ClipboardItem && navigator.clipboard && navigator.clipboard.write);
    if(canClip){
      try{
        navigator.clipboard.write([new ClipboardItem({'image/png': makeBlob()})]).then(function(){
          toast('התמונה הועתקה ✓ — בלוח: פתחו פוסט חדש והדביקו (Ctrl+V)');
        }).catch(function(){
          makeBlob().then(function(bl){ downloadBlob(bl); toast('התמונה הורדה — גררו אותה ללוח שנפתח'); });
        });
        return;
      }catch(e){}
    }
    makeBlob().then(function(bl){
      downloadBlob(bl);
      toast(win?'התמונה הורדה — גררו אותה ללוח שנפתח':'התמונה הורדה — אפשרו חלונות קופצים');
    }).catch(function(){ toast('שגיאה ביצירת התמונה'); });
  }

  let tt;function toast(m){const el=document.getElementById('toast');el.textContent=m;el.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),2400);}
  return {init,add,del,toggleAi,preset,toggleTimer,resetTimer,exportPNG,copyText,saveFile,sharePadlet};
})();
window.App=App; App.init();
</script>
