<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>חילוץ תובנה — קבלת החלטות מבוססת נתונים</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alef:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--canvas:#FAF5EC;--paper:#F2EADC;--card:#FFFDF8;--ink:#2A211B;--ink-soft:#6B5D52;--line:#E3D8C6;--brand:#B4502F;--brand-deep:#8F3D22;--root:#D99A2B;--leaf:#2E7D4F;--core-1:#1F5F5B;--warn:#A8362D;--sans:'Alef','Segoe UI',Arial,sans-serif;--shadow:0 10px 30px rgba(42,33,27,.12);--shadow-sm:0 3px 12px rgba(42,33,27,.08)}
  *{box-sizing:border-box} html,body{margin:0;min-height:100%}
  body{font-family:var(--sans);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;background:var(--canvas);background-image:radial-gradient(1100px 520px at 78% -8%,rgba(180,80,47,.10),transparent 60%),radial-gradient(900px 480px at 10% 6%,rgba(31,95,91,.09),transparent 60%);display:flex;flex-direction:column;min-height:100vh}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit} textarea,input{font-family:inherit}
  h1,h2,h3,h4{font-weight:700;line-height:1.15;margin:0} a{color:var(--brand-deep)}
  header.bar{display:flex;align-items:center;gap:16px;padding:12px 22px;background:rgba(250,245,236,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
  .brand{display:flex;align-items:center;gap:11px;font-weight:700;font-size:19px;letter-spacing:-.4px}
  .brand .mark{width:28px;height:28px}
  .daytag{font-size:12px;font-weight:700;color:#FFFDF8;background:var(--core-1);padding:3px 10px;border-radius:999px}
  .hublink{margin-inline-start:auto;font-size:14px;font-weight:700;color:var(--ink-soft);text-decoration:none;border:1px solid var(--line);background:#FFFDF8;padding:8px 14px;border-radius:10px}
  .hublink:hover{color:var(--ink);border-color:#CBBDA6}
  .btn{padding:10px 16px;border-radius:11px;font-weight:700;font-size:14px;transition:.15s;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px}
  .btn-brand{background:linear-gradient(135deg,var(--brand),var(--brand-deep));color:#FFFDF8;box-shadow:0 4px 14px rgba(180,80,47,.28)}.btn-brand:hover{background:var(--brand-deep)}
  .btn-ghost{color:var(--ink-soft);border:1px solid var(--line);background:#FFFDF8}.btn-ghost:hover{color:var(--ink);border-color:#CBBDA6}
  .btn-dark{background:var(--ink);color:#FFFDF8}.btn-dark:hover{background:#1C1512}
  .wrap{flex:1;width:100%;max-width:800px;margin:0 auto;padding:24px 20px 56px}
  .head{text-align:center;margin-bottom:20px}
  .head .eyebrow{display:inline-block;font-size:12px;font-weight:700;letter-spacing:1px;color:#FFFDF8;background:var(--brand);padding:3px 11px;border-radius:999px}
  .head h1{font-size:clamp(30px,5vw,42px);letter-spacing:-1.2px;margin-top:8px}
  .head p{color:var(--ink-soft);max-width:600px;margin:10px auto 0;font-size:15px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow-sm);margin-bottom:16px}
  .field-label{font-size:14px;font-weight:700;margin:2px 0 7px;display:flex;align-items:center;gap:7px}
  .field-label .t{font-weight:400;color:var(--ink-soft);font-size:12.5px}
  .in-wrap{position:relative}
  textarea,input.txt{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;font-size:14.5px;background:#FFFDF8;color:var(--ink);resize:vertical;line-height:1.5}
  textarea{min-height:62px;padding-bottom:36px}
  textarea:focus,input.txt:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(180,80,47,.14)}
  .insight-in{border-color:var(--brand);background:#FBF1EA}
  .mic{position:absolute;inset-inline-start:8px;bottom:8px;width:30px;height:30px;border-radius:8px;background:#FFFDF8;border:1px solid var(--line);color:var(--brand-deep);display:grid;place-items:center}
  .mic:hover{border-color:var(--brand);background:#FBF1EA}
  .mic.rec{background:#A8362D;border-color:#A8362D;color:#FFFDF8;animation:pulse 1.1s ease-out infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(228,70,58,.5)}100%{box-shadow:0 0 0 12px rgba(228,70,58,0)}}
  .hint{font-size:12.5px;color:var(--ink-soft);margin-top:6px}

  .checks-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .checks-head h3{font-size:18px}
  .meter{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ink-soft)}
  .meter .bar{width:90px;height:8px;border-radius:5px;background:#E3D8C6;overflow:hidden}
  .meter .bar .fill{height:100%;background:var(--leaf);width:0;transition:width .3s}
  .check{border:1px solid var(--line);border-radius:13px;padding:13px 14px;margin-bottom:10px;transition:.15s}
  .check.on{border-color:var(--leaf);background:#f4faf6}
  .check .top{display:flex;align-items:flex-start;gap:11px}
  .check .box{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);background:#FFFDF8;flex:0 0 auto;display:grid;place-items:center;margin-top:1px;font-weight:700;color:#FFFDF8;transition:.15s}
  .check.on .box{background:var(--leaf);border-color:var(--leaf)}
  .check .ttl{font-size:15px;font-weight:700}
  .check .q{font-size:13px;color:var(--ink-soft);margin-top:2px}
  .check .note{margin-top:10px}
  .check .note input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:8px 11px;font-size:13.5px}
  .check .note input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(180,80,47,.12)}

  .disp{display:flex;gap:9px;flex-wrap:wrap;margin-top:8px}
  .disp button{flex:1;min-width:130px;border:1.5px solid var(--line);background:#FFFDF8;border-radius:12px;padding:12px;font-weight:700;font-size:13.5px;color:var(--ink);text-align:center;transition:.15s}
  .disp button .d{display:block;font-weight:400;color:var(--ink-soft);font-size:12px;margin-top:3px}
  .disp button.on{border-color:var(--brand);background:#FBF1EA;color:var(--brand-deep)}

  .exportbar{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:6px}
  .exportbar .btn{width:100%}
  .metarow{display:flex;gap:8px;margin-bottom:16px}
  .metarow input{flex:1}
  .cloud{margin-top:16px;border:1px solid var(--line);border-radius:14px;padding:15px;background:var(--paper)}
  .cloud h4{font-size:14.5px;display:flex;align-items:center;gap:7px}
  .cloud .row{display:flex;gap:8px;margin-top:10px}.cloud .row input{flex:1}

  footer.credit{display:flex;align-items:center;justify-content:center;gap:11px;padding:14px 22px;text-align:center;font-size:13px;color:var(--ink-soft);background:rgba(250,245,236,.9);border-top:1px solid var(--line)}
  footer.credit .credit-ava{width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid #FFFDF8;box-shadow:var(--shadow-sm)}
  footer.credit a{color:var(--brand-deep);font-weight:700;text-decoration:none}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#FFFDF8;padding:12px 22px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:100;box-shadow:var(--shadow)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (max-width:640px){.exportbar{grid-template-columns:1fr 1fr}}
  @media (prefers-reduced-motion:reduce){.mic.rec{animation:none}.toast{transition:none}}
</style>
<link rel="stylesheet" href="../../assets/site.css?v=4">
</head>
<body>
  <header class="bar">
    <div class="brand"><svg class="mark" viewBox="0 0 24 24" fill="none"><path d="M4 20h16M7 20V12M12 20V6M17 20v-5" stroke="#B4502F" stroke-width="2.4" stroke-linecap="round"/><circle cx="17" cy="9" r="2.6" fill="#D99A2B"/></svg>חילוץ תובנה</div>
    <span class="daytag">יום 2 · תובנה</span>
    <a class='hublink' href='../'>‹ כל הכלים</a>
  </header>

  <main class="wrap" id="app"></main>

  <footer class="credit"><img class="credit-ava" src="../../assets/roman.jpg" alt="רומן גרינשטיין"><span>נבנה ע"י רומן גרינשטיין · <a href="mailto:romangash@gmail.com">romangash@gmail.com</a></span></footer>
  <input type="file" id="fileIn" accept="application/json,.json" style="display:none">
  <div class="toast" id="toast"></div>

<script>
const App=(()=>{
  'use strict';
  const LS='dd_insight_tool_v1', PADLET_KEY='toolkit_padlet_url';
  const DEFAULT_PADLET='https://padlet.com/romangash/padlet-emxukhiqh96z99bl';
  const CHECKS=[
    {k:'מתאם ≠ סיבתיות', q:'ששני דברים עולים יחד לא אומר שאחד גורם לשני. מה עוד יכול להסביר את זה?', e:''},
    {k:'מי אסף ולמה?', q:'לגוף שאסף את הנתון יש לפעמים אינטרס. מאיפה הגיע?', e:''},
    {k:'מתי נאסף?', q:'נתון ישן לא בהכרח מתאר את המצב היום. האם הוא עדכני?', e:''},
    {k:'גודל המדגם', q:'כמה נספרו? 10 תגובות אינן כל התושבים.', e:''},
    {k:'מה חסר?', q:'מי לא נספר בכלל — ולכן פשוט לא נראה?', e:''}
  ];
  const DISP=[{k:'עמודות',d:'להשוואה בין קטגוריות'},{k:'קו מגמה',d:'שינוי לאורך זמן'},{k:'מספר בודד',d:'כשיש נתון אחד חזק'}];
  let data=fresh();

  function fresh(){ return {meta:{title:'',team:''}, finding:'', insight:'', checks:CHECKS.map(()=>({done:false,note:''})), display:''}; }
  function persist(){ try{localStorage.setItem(LS,JSON.stringify(data));}catch(e){} }
  function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function attr(s){return esc(s).replace(/"/g,'&quot;');}

  function init(){ try{const s=JSON.parse(localStorage.getItem(LS)); if(s&&s.checks)data=s;}catch(e){} document.getElementById('fileIn').addEventListener('change',onFile); render(); }
  function onFile(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{data=JSON.parse(r.result);render();toast('נטען');}catch(err){toast('קובץ לא תקין');}};r.readAsText(f);e.target.value='';}

  function micBtn(t){ return `<button class="mic" data-t="${t}" title="הכתבה קולית"></button>`; }

  function render(){
    const done=data.checks.filter(c=>c.done).length;
    const padletUrl=(()=>{try{return localStorage.getItem(PADLET_KEY)||DEFAULT_PADLET}catch(e){return DEFAULT_PADLET}})();
    document.getElementById('app').innerHTML=`
      <div class="head">
        <div class="eyebrow">מנתון — לתובנה · חשיבה ביקורתית</div>
        <h1>מחלצים תובנה מנתונים</h1>
        <p>הנתון מראה <b>מה</b> — לא <b>למה</b>. נסחו תובנה אחת חזקה, ואז העבירו אותה דרך 5 בדיקות לפני שסומכים עליה.</p>
      </div>

      <div class="panel">
        <div class="metarow"><input class="txt" id="mTitle" placeholder="נושא / שאלת המחקר" value="${attr(data.meta.title)}"><input class="txt" id="mTeam" placeholder="שם הצוות" value="${attr(data.meta.team)}"></div>
        <div class="field-label">הממצא מהנתונים <span class="t">מה הנתונים מראים</span></div>
        <div class="in-wrap"><textarea id="finding" placeholder="לדוגמה: ירידה של 40% בפעילות ערב ברחוב המסחר לעומת אשתקד.">${esc(data.finding)}</textarea>${micBtn('finding')}</div>
        <div class="field-label" style="margin-top:16px">התובנה <span class="t">משפט אחד + מספר אחד</span></div>
        <div class="in-wrap"><textarea id="insight" class="insight-in" placeholder="לדוגמה: כל עסק שני במרכז סוגר מוקדם — ואיתו נעלמת פעילות הערב.">${esc(data.insight)}</textarea>${micBtn('insight')}</div>
        <div class="hint">תובנה חזקה אפשר לנסח במשפט אחד עם מספר אחד.</div>
      </div>

      <div class="panel">
        <div class="checks-head">
          <h3>5 בדיקות ביקורתיות</h3>
          <div class="meter">${done}/5 <div class="bar"><div class="fill" style="width:${done/5*100}%"></div></div></div>
        </div>
        ${CHECKS.map((c,i)=>`
          <div class="check ${data.checks[i].done?'on':''}">
            <div class="top" onclick="App.toggle(${i})" style="cursor:pointer">
              <div class="box">${data.checks[i].done?'✓':''}</div>
              <div><div class="ttl">${c.e} ${c.k}</div><div class="q">${c.q}</div></div>
            </div>
            <div class="note"><input data-note="${i}" placeholder="מה בדקתם? מה מצאתם?" value="${attr(data.checks[i].note)}"></div>
          </div>`).join('')}
      </div>

      <div class="panel">
        <div class="field-label">איך תציגו את התובנה? <span class="t">הגרף משרת את המסר</span></div>
        <div class="disp">${DISP.map(d=>`<button class="${data.display===d.k?'on':''}" onclick="App.setDisp('${d.k}')">${d.k}<span class="d">${d.d}</span></button>`).join('')}</div>
      </div>

      <div class="panel">
        <div class="field-label">ייצוא ושיתוף</div>
        <div class="exportbar">
          <button class="btn btn-brand" onclick="App.exportPNG()">תמונה</button>
          <button class="btn btn-ghost" onclick="App.copyText()">העתקה</button>
          <button class="btn btn-ghost" onclick="App.saveFile()">שמירה</button>
          <button class="btn btn-ghost" onclick="document.getElementById('fileIn').click()">טעינה</button>
        </div>
        <div class="cloud">
          <h4>הלוח המשותף (Padlet)</h4>
          <a href="https://padlet.com/romangash/padlet-emxukhiqh96z99bl" target="_blank" rel="noopener" class="btn btn-dark" style="margin-top:10px;width:100%;text-decoration:none">↗ פתיחת הלוח</a>
          <div class="hint" style="margin-top:10px;line-height:1.75"><b>איך מעלים ללוח:</b><br>1. לוחצים על <b>תמונה</b> — התמונה נשמרת במחשב.<br>2. לוחצים על <b>פתיחת הלוח</b> למעלה.<br>3. בלוח לוחצים על כפתור <b>+</b> (הוספת פוסט).<br>4. גוררים את התמונה לפוסט, או לוחצים על סמל התמונה ובוחרים אותה.<br>5. לוחצים <b>פרסום</b>. זהו!</div>
        </div>
      </div>`;
    wire();
  }

  function wire(){
    const bind=(id,key)=>{const el=document.getElementById(id);if(el)el.addEventListener('input',()=>{data[key]=el.value;persist();});};
    bind('finding','finding'); bind('insight','insight');
    ['mTitle:title','mTeam:team'].forEach(p=>{const[id,k]=p.split(':');const el=document.getElementById(id);if(el)el.addEventListener('input',()=>{data.meta[k]=el.value;persist();});});
    document.querySelectorAll('[data-note]').forEach(el=>el.addEventListener('input',()=>{data.checks[+el.dataset.note].note=el.value;persist();}));
    const pu=document.getElementById('padletUrl'); if(pu)pu.addEventListener('input',e=>{try{localStorage.setItem(PADLET_KEY,e.target.value.trim());}catch(e){}});
    document.querySelectorAll('.mic').forEach(b=>b.addEventListener('click',()=>dictate(document.getElementById(b.dataset.t),b)));
  }
  function toggle(i){ data.checks[i].done=!data.checks[i].done; persist(); render(); }
  function setDisp(k){ data.display=data.display===k?'':k; persist(); render(); }

  let recog=null;
  function dictate(el,btn){if(!el)return;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('הכתבה קולית נתמכת ב‑Chrome / Edge');return;}if(recog){recog.stop();return;}recog=new SR();recog.lang='he-IL';recog.interimResults=true;recog.continuous=false;const base=(el.value||'').trim();btn.classList.add('rec');recog.onresult=(e)=>{let f='',i='';for(let k=0;k<e.results.length;k++){const r=e.results[k];if(r.isFinal)f+=r[0].transcript;else i+=r[0].transcript;}el.value=(base?base+' ':'')+(f+i).trim();el.dispatchEvent(new Event('input',{bubbles:true}));};recog.onend=()=>{btn.classList.remove('rec');recog=null;el.focus();};recog.onerror=()=>{btn.classList.remove('rec');recog=null;};try{recog.start();toast('מקשיב…');}catch(e){btn.classList.remove('rec');recog=null;}}

  function identity(){
    try{ var s=JSON.parse(localStorage.getItem('toolkit_identity')||'{}');
      return [s.name,s.dept,s.role].filter(Boolean).join(' · ');
    }catch(e){ return ''; }
  }
  function fileName(x){return (data.meta.title||'תובנה').replace(/[\\/:*?"<>|]/g,'').slice(0,40)+'.'+x;}
  let mc;function measure(){if(!mc)mc=document.createElement('canvas').getContext('2d');return mc;}
  function wrapLines(t,w,f){const c=measure();c.font=f;const words=(t||'').split(/\s+/).filter(Boolean);if(!words.length)return[''];const L=[];let cur=words[0];for(let i=1;i<words.length;i++){const x=cur+' '+words[i];if(c.measureText(x).width<=w)cur=x;else{L.push(cur);cur=words[i];}}L.push(cur);return L;}
  function drawDoc(scale){
    const W=800,PAD=40,cw=W-PAD*2,F='Alef, sans-serif';
    const blk=[];
    const H=(t,c)=>blk.push({t:'h',x:t,c});const P=(l,v)=>{blk.push({t:'k',x:l});wrapLines(v||'—',cw-16,`400 15px ${F}`).forEach(ln=>blk.push({t:'p',x:ln}));};
    H('הממצא','#6B5D52'); wrapLines(data.finding||'—',cw-16,`400 15px ${F}`).forEach(ln=>blk.push({t:'p',x:ln}));
    H('התובנה','#B4502F'); wrapLines(data.insight||'—',cw-16,`700 16px ${F}`).forEach(ln=>blk.push({t:'pb',x:ln}));
    H('5 בדיקות ביקורתיות','#D99A2B');
    CHECKS.forEach((c,i)=>{ const ck=data.checks[i]; wrapLines((ck.done?'☑ ':'☐ ')+c.k+(ck.note?' — '+ck.note:''),cw-16,`400 14px ${F}`).forEach(ln=>blk.push({t:'p',x:ln})); });
    if(data.display){ H('תצוגה מומלצת','#1F5F5B'); blk.push({t:'p',x:data.display}); }
    const headerH=80,footerH=40;let y=headerH+22;blk.forEach(b=>{y+= b.t==='h'?32: b.t==='pb'?24: b.t==='k'?24:22;});const Ht=y+footerH+16;
    const cv=document.createElement('canvas'),sc=scale;cv.width=W*sc;cv.height=Ht*sc;const x=cv.getContext('2d');x.scale(sc,sc);
    x.fillStyle='#FAF5EC';x.fillRect(0,0,W,Ht);x.fillStyle='#1F5F5B';x.fillRect(0,0,W,headerH);
    x.direction='rtl';x.textBaseline='middle';x.fillStyle='#FFFDF8';x.textAlign='right';x.font=`700 24px ${F}`;x.fillText(data.meta.title||'חילוץ תובנה',W-PAD,32);
    x.font=`400 14px ${F}`;x.fillStyle='rgba(255,255,255,.8)';var __s=[identity(),data.meta.team].filter(Boolean).join(' · ');if(__s)x.fillText(__s,W-PAD,58);
    x.textAlign='left';x.font=`700 12px ${F}`;x.fillStyle='rgba(255,255,255,.7)';x.fillText('ממצא · תובנה · 5 בדיקות',PAD,40);
    y=headerH+22;
    blk.forEach(b=>{if(b.t==='h'){x.textAlign='right';x.fillStyle=b.c;x.font=`700 17px ${F}`;x.beginPath();x.arc(W-PAD-5,y,5,0,7);x.fill();x.fillText('   '+b.x,W-PAD,y);y+=32;}else if(b.t==='pb'){x.textAlign='right';x.fillStyle='#8F3D22';x.font=`700 16px ${F}`;x.fillText(b.x,W-PAD,y);y+=24;}else if(b.t==='k'){x.textAlign='right';x.fillStyle='#8F3D22';x.font=`700 14px ${F}`;x.fillText(b.x,W-PAD,y);y+=24;}else{x.textAlign='right';x.fillStyle='#2A211B';x.font=`400 15px ${F}`;x.fillText(b.x,W-PAD-8,y);y+=22;}});
    x.textAlign='center';x.fillStyle='#6B5D52';x.font=`400 12px ${F}`;x.fillText('נבנה ע"י רומן גרינשטיין · romangash@gmail.com',W/2,Ht-footerH/2);
    return cv;
  }
  function exportPNG(){try{const cv=drawDoc(2);cv.toBlob(b=>{const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=fileName('png');a.click();setTimeout(()=>URL.revokeObjectURL(u),1500);toast('התמונה הורדה');},'image/png');}catch(e){toast('שגיאה');}}
  function copyText(){let t=`${data.meta.title||'חילוץ תובנה'}${data.meta.team?' · '+data.meta.team:''}\n\n■ הממצא:\n${data.finding||'—'}\n\n■ התובנה:\n${data.insight||'—'}\n\n■ 5 בדיקות:\n`+CHECKS.map((c,i)=>`${data.checks[i].done?'☑':'☐'} ${c.k}${data.checks[i].note?' — '+data.checks[i].note:''}`).join('\n')+(data.display?`\n\n■ תצוגה: ${data.display}`:'')+`\n\n— נבנה בכלי "חילוץ תובנה" מאת רומן גרינשטיין`;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('הועתק ✓')).catch(()=>prompt('העתיקו:',t));}
  function saveFile(){const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=fileName('json');a.click();setTimeout(()=>URL.revokeObjectURL(u),1500);toast('נשמר');}
  function makeBlob(){
    return new Promise(function(res,rej){
      try{ drawDoc(2).toBlob(function(b){ b?res(b):rej(new Error('blob')); },'image/png'); }
      catch(e){ rej(e); }
    });
  }
  function downloadBlob(bl){
    var u=URL.createObjectURL(bl); var a=document.createElement('a');
    a.href=u; a.download=fileName('png'); document.body.appendChild(a); a.click();
    setTimeout(function(){ try{document.body.removeChild(a);}catch(e){} URL.revokeObjectURL(u); },1500);
  }
  function sharePadlet(){
    var padlet='';
    try{ padlet=localStorage.getItem(PADLET_KEY)||''; }catch(e){}
    var inp=document.getElementById('padletUrl');
    if(inp&&inp.value&&inp.value.trim()) padlet=inp.value.trim();
    if(!padlet) padlet=DEFAULT_PADLET;

    // 1) נייד: שיתוף ישיר לאפליקציית Padlet
    var isMobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    if(isMobile && navigator.canShare && navigator.share){
      makeBlob().then(function(bl){
        var file=new File([bl],fileName('png'),{type:'image/png'});
        if(navigator.canShare({files:[file]})){
          navigator.share({files:[file],title:data.meta.title||'תובנה'}).catch(function(){
            downloadBlob(bl); try{window.open(padlet,'_blank','noopener');}catch(e){}
            toast('התמונה הורדה — העלו אותה ללוח');
          });
        } else { downloadBlob(bl); try{window.open(padlet,'_blank','noopener');}catch(e){} }
      }).catch(function(){ toast('שגיאה ביצירת התמונה'); });
      return;
    }

    // 2) מחשב: מעתיקים את התמונה ללוח ההעתקה ופותחים את Padlet
    var win=null;
    try{ win=window.open(padlet,'_blank','noopener'); }catch(e){}
    var canClip = !!(window.ClipboardItem && navigator.clipboard && navigator.clipboard.write);
    if(canClip){
      try{
        navigator.clipboard.write([new ClipboardItem({'image/png': makeBlob()})]).then(function(){
          toast('התמונה הועתקה ✓ — בלוח: פתחו פוסט חדש והדביקו (Ctrl+V)');
        }).catch(function(){
          makeBlob().then(function(bl){ downloadBlob(bl); toast('התמונה הורדה — גררו אותה ללוח שנפתח'); });
        });
        return;
      }catch(e){}
    }
    makeBlob().then(function(bl){
      downloadBlob(bl);
      toast(win?'התמונה הורדה — גררו אותה ללוח שנפתח':'התמונה הורדה — אפשרו חלונות קופצים');
    }).catch(function(){ toast('שגיאה ביצירת התמונה'); });
  }

  let tt;function toast(m){const el=document.getElementById('toast');el.textContent=m;el.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),2400);}
  return {init,toggle,setDisp,exportPNG,copyText,saveFile,sharePadlet};
})();
window.App=App; App.init();
</script>
