<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הגדרת האתגר — כלי לרשויות מקומיות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alef:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --canvas:#FAF5EC; --paper:#F2EADC; --card:#FFFFFF;
    --ink:#2A211B; --ink-soft:#6B5D52; --line:#E3D8C6;
    --brand:#B4502F; --brand-deep:#8F3D22;
    --root:#D99A2B; --root-bg:#F4DED3; --root-bd:#E7C9A6; --root-tx:#7A4A1E;
    --leaf:#2E7D4F; --leaf-bg:#E7F3EE; --leaf-bd:#A9D6C4; --leaf-tx:#1C5A44;
    --core-1:#1F5F5B; --core-2:#1F5F5B;
    --sans:'Alef','Segoe UI', Arial, sans-serif;
    --shadow:0 10px 30px rgba(42,33,27,.12); --shadow-sm:0 3px 12px rgba(42,33,27,.08);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:var(--sans); color:var(--ink); line-height:1.55; -webkit-font-smoothing:antialiased;
    background:var(--canvas);
    background-image:radial-gradient(1100px 520px at 78% -8%, rgba(180,80,47,.10), transparent 60%),radial-gradient(900px 480px at 10% 6%, rgba(31,95,91,.09), transparent 60%);}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit}
  textarea,input,select{font-family:inherit}
  h1,h2,h3,h4{font-weight:700; line-height:1.15; margin:0}
  a{color:var(--brand-deep)}

  .app{display:flex; flex-direction:column; min-height:100vh}
  header.bar{display:flex; align-items:center; gap:16px; padding:12px 22px; background:rgba(250,245,236,.82); backdrop-filter:blur(12px); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:40}
  .brand{display:flex; align-items:center; gap:11px; font-weight:700; font-size:19px; letter-spacing:-.4px}
  .brand .mark{width:28px;height:28px;flex:0 0 28px}
  .hublink{margin-inline-start:auto; font-size:14px; font-weight:700; color:var(--ink-soft); text-decoration:none; border:1px solid var(--line); background:#FFFDF8; padding:8px 14px; border-radius:10px}
  .hublink:hover{color:var(--ink); border-color:#CBBDA6}
  .bar-actions{display:flex; gap:8px}
  .btn{padding:10px 16px; border-radius:11px; font-weight:700; font-size:14px; transition:.15s; white-space:nowrap; display:inline-flex; align-items:center; justify-content:center; gap:8px}
  .btn-ghost{color:var(--ink-soft); border:1px solid var(--line); background:#FFFDF8}
  .btn-ghost:hover{color:var(--ink); border-color:#CBBDA6}
  .btn-brand{background:linear-gradient(135deg,var(--brand),var(--brand-deep)); color:#FFFDF8; box-shadow:0 4px 14px rgba(180,80,47,.28)}
  .btn-brand:hover{background:var(--brand-deep)}
  .btn-dark{background:var(--ink); color:#FFFDF8}
  .btn-dark:hover{background:#1C1512}

  .wrap{flex:1; width:100%; max-width:820px; margin:0 auto; padding:26px 20px 56px}

  /* stepbar */
  .stepbar{margin-bottom:20px}
  .sb-head{font-size:13px; font-weight:700; color:var(--brand-deep); text-align:center; margin-bottom:11px}
  .sb-track{display:flex; position:relative}
  .sb-line{position:absolute; top:16px; right:12.5%; left:12.5%; height:3px; background:#E3D8C6; border-radius:2px; z-index:0}
  .sb-line .fill{position:absolute; right:0; top:0; height:100%; background:var(--brand); border-radius:2px; transition:width .35s ease}
  .sb-seg{flex:1; display:flex; flex-direction:column; align-items:center; gap:7px}
  .sb-num{position:relative; z-index:1; width:33px;height:33px;border-radius:50%; display:grid;place-items:center; font-weight:700; font-size:14px; background:#E3D8C6; color:var(--ink-soft); transition:.25s}
  .sb-lbl{font-size:12px; font-weight:700; color:var(--ink-soft)}
  .sb-seg.done .sb-num{background:var(--leaf); color:#FFFDF8}
  .sb-seg.active .sb-num{background:var(--brand); color:#FFFDF8; transform:scale(1.22); box-shadow:0 0 0 5px rgba(180,80,47,.16)}
  .sb-seg.active .sb-lbl{color:var(--brand-deep)}

  .save-warn{display:flex; gap:9px; align-items:flex-start; background:#FFF6E9; border:1px solid #F0D9AE; color:#7A4A1E; border-radius:12px; padding:11px 13px; font-size:13px; font-weight:700; line-height:1.5; margin-bottom:18px}

  .panel{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:24px; box-shadow:var(--shadow-sm)}
  .eyebrow{display:inline-block;font-size:12px;font-weight:700;letter-spacing:1px;color:#FFFDF8;background:var(--brand);padding:3px 11px;border-radius:999px}
  h2.title{font-size:29px; margin:6px 0 0; letter-spacing:-.8px}
  .why{background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:13px 15px; margin:16px 0; font-size:14.5px; color:var(--ink-soft)}
  .why b{color:var(--ink)}
  .field-label{font-size:14px; font-weight:700; margin:16px 0 7px}
  .in-wrap{position:relative}
  textarea, input.txt, select.txt{width:100%; border:1.5px solid var(--line); border-radius:12px; padding:12px 14px; font-size:15px; background:#FFFDF8; color:var(--ink); transition:.15s}
  textarea{min-height:96px; line-height:1.55; resize:vertical; padding-bottom:40px}
  textarea:focus, input.txt:focus, select.txt:focus{outline:none; border-color:var(--brand); box-shadow:0 0 0 3px rgba(180,80,47,.14)}
  .mic{position:absolute; inset-inline-start:8px; bottom:8px; width:32px;height:32px; border-radius:9px; background:#FFFDF8; border:1px solid var(--line); color:var(--brand-deep); display:grid; place-items:center; transition:.15s; z-index:2}
  .in-wrap.inline .mic{top:50%; bottom:auto; transform:translateY(-50%)}
  .in-wrap.inline input.txt{padding-inline-start:46px}
  .mic:hover{border-color:var(--brand); background:#FBF1EA}
  .mic.rec{background:#A8362D; border-color:#A8362D; color:#FFFDF8; animation:pulse 1.1s ease-out infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(228,70,58,.5)}100%{box-shadow:0 0 0 12px rgba(228,70,58,0)}}
  .hint{font-size:12.5px; color:var(--ink-soft); margin-top:6px}

  /* suggestion chips */
  .sugg-group{margin-top:14px}
  .sugg-group h4{font-size:13px; font-weight:700; color:var(--ink-soft); margin-bottom:8px}
  .chips{display:flex; flex-wrap:wrap; gap:8px}
  .chip{font-size:13.5px; font-weight:700; padding:7px 13px; border-radius:999px; border:1.5px solid var(--line); background:#FFFDF8; color:var(--ink); transition:.12s}
  .chip:hover{border-color:var(--brand); color:var(--brand-deep); background:#FBF1EA}
  .chip.used{opacity:.4; pointer-events:none}
  .chip .p{color:var(--leaf); font-weight:700; margin-inline-end:4px}

  .add-row{display:flex; gap:8px; margin-top:14px}
  .add-row .in-wrap{flex:1}
  .add-btn{flex:0 0 auto; padding:0 18px; border-radius:12px; background:var(--ink); color:#FFFDF8; font-weight:700}
  .add-btn:hover{background:#1C1512}

  /* selected items */
  .items{display:flex; flex-direction:column; gap:10px; margin-top:16px}
  .item{border:1px solid var(--line); border-radius:13px; padding:12px 14px; background:#FFFDF8; position:relative}
  .item.stk{border-inline-start:4px solid var(--root)}
  .item.dat{border-inline-start:4px solid var(--leaf)}
  .item-top{display:flex; align-items:center; gap:8px; margin-bottom:8px}
  .item-name{font-weight:700; font-size:15px; flex:1}
  .item-name[contenteditable]{outline:none; border-radius:6px; padding:2px 4px}
  .item-name[contenteditable]:focus{background:#FBF1EA}
  .item .del{width:26px;height:26px;border-radius:50%; background:#FFFDF8; border:1px solid var(--line); color:#A8362D; font-weight:700; display:grid; place-items:center; flex:0 0 auto}
  .item .del:hover{transform:scale(1.1)}
  .item-fields{display:flex; gap:8px; flex-wrap:wrap}
  .item-fields input.txt, .item-fields select.txt{font-size:13.5px; padding:8px 11px}
  .item-fields .grow{flex:1; min-width:150px}
  .item-fields .lvl{flex:0 0 auto; width:140px}
  .item-fields .src{flex:0 0 auto; width:170px}
  .empty{color:var(--ink-soft); font-size:14px; text-align:center; padding:18px; border:1.5px dashed var(--line); border-radius:12px; margin-top:16px}

  /* sources panel */
  .sources{margin-top:20px; border-top:1px solid var(--line); padding-top:16px}
  .sources h4{font-size:14px; margin-bottom:4px}
  .sources .sub{font-size:12.5px; color:var(--ink-soft); margin-bottom:12px}
  .src-list{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .src-card{display:block; border:1px solid var(--line); border-radius:12px; padding:12px 14px; background:#FFFDF8; text-decoration:none; color:var(--ink); transition:.15s}
  .src-card:hover{border-color:var(--brand); box-shadow:var(--shadow-sm); transform:translateY(-2px)}
  .src-card .n{font-weight:700; font-size:14px; color:var(--brand-deep); display:flex; align-items:center; gap:6px}
  .src-card .d{font-size:12.5px; color:var(--ink-soft); margin-top:3px}
  .src-card .add{font-size:12px; font-weight:700; color:var(--leaf); margin-top:6px; display:inline-block}

  .tips{margin-top:16px; background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:13px 15px}
  .tips h4{font-size:13.5px; margin-bottom:6px}
  .tips ul{margin:0; padding-inline-start:18px; color:var(--ink-soft); font-size:13.5px; line-height:1.7}
  .tips .good{color:var(--leaf); font-weight:700} .tips .bad{color:#A8362D; font-weight:700}

  .g-nav{display:flex; gap:10px; margin-top:22px}
  .g-nav .btn{flex:1}

  /* summary */
  .sum-sec{margin-bottom:18px}
  .sum-sec h3{font-size:16px; display:flex; align-items:center; gap:8px; margin-bottom:8px}
  .sum-sec h3 .dot{width:10px;height:10px;border-radius:50%}
  .sum-sec .body{font-size:14.5px; color:var(--ink); background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:13px 15px}
  .sum-sec ul{margin:0; padding-inline-start:18px}
  .sum-sec li{margin:3px 0}
  .meta-grid{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px}
  .meta-grid input.txt{flex:1; min-width:140px}
  .exp-grid{display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:8px}
  .exp-grid .btn{width:100%}
  .cloud{margin-top:18px; border:1px solid var(--line); border-radius:14px; padding:15px; background:var(--paper)}
  .cloud h4{font-size:14.5px; display:flex; align-items:center; gap:7px}
  .cloud .row{display:flex; gap:8px; margin-top:10px}
  .cloud .row input{flex:1}
  details.setup{margin-top:12px; font-size:13px}
  details.setup summary{cursor:pointer; font-weight:700; color:var(--brand-deep)}
  details.setup ol{padding-inline-start:20px; color:var(--ink-soft); line-height:1.7}
  details.setup pre{background:#1C1512; color:#d6e6e2; padding:12px; border-radius:10px; overflow:auto; font-size:12px; direction:ltr; text-align:left}

  footer.credit{display:flex; align-items:center; justify-content:center; gap:11px; padding:12px 22px; text-align:center; font-size:13px; color:var(--ink-soft); background:rgba(250,245,236,.86); border-top:1px solid var(--line)}
  footer.credit .credit-ava{width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid #FFFDF8;box-shadow:var(--shadow-sm);flex:0 0 auto}
  footer.credit a{color:var(--brand-deep); font-weight:700; text-decoration:none}

  .toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--ink); color:#FFFDF8; padding:12px 22px; border-radius:12px; font-weight:700; font-size:14px; opacity:0; pointer-events:none; transition:.25s; z-index:100; box-shadow:var(--shadow)}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  .shake{animation:shake .45s} @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

  @media (max-width:760px){ .src-list{grid-template-columns:1fr} .exp-grid{grid-template-columns:1fr} .item-fields .lvl,.item-fields .src{width:100%} }
  @media (prefers-reduced-motion:reduce){ .mic.rec,.shake{animation:none} .toast{transition:none} }
</style>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="../assets/favicon-32.png" sizes="32x32" type="image/png">

<body>
<div class="app">
  <header class="bar">
    <div class="brand">
      <svg class="mark" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#B4502F" stroke-width="2"/><path d="M12 8v5l3 2" stroke="#D99A2B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      הגדרת האתגר
    </div>
    <a class='hublink' href='../maazim/'>‹ כל הכלים</a>
    <div class="bar-actions" id="barActions"></div>
  </header>

  <main class="wrap" id="content"></main>

  <footer class="credit"><img class="credit-ava" src="../assets/roman.jpg" alt="רומן גרינשטיין"><span>נבנה ע"י רומן גרינשטיין · כל הערה תתקבל בברכה במייל: <a href="mailto:romangash@gmail.com">romangash@gmail.com</a></span></footer>
</div>

<input type="file" id="fileIn" accept="application/json,.json" style="display:none">
<div class="toast" id="toast"></div>

<script>
const App = (() => {
  'use strict';
  const LS_KEY='challenge_def_v1', CLOUD_KEY='challenge_cloud_url';
  let data, step=1, uid=1;
  const nid=()=>'n'+(uid++);

  const STK={
    'בתוך הרשות':['ראש/ת הרשות','מנכ״ל/ית','מהנדס/ת העיר','גזבר/ית','אגף שפ״ע','אגף רווחה','אגף חינוך','תחבורה ותנועה','מינהל הנדסה ותכנון','קהילה ומעורבות','דוברות','מוקד עירוני 106','ביטחון וסדר ציבורי','נוער וצעירים','קיימות וסביבה','פיתוח כלכלי','אגף נכסים'],
    'מחוץ לרשות':['תושבים/ות','ועד שכונה/רובע','בעלי עסקים','עמותות וארגונים','מוסדות חינוך','משטרה','כבאות ומד״א','משרדי ממשלה','חברות תשתית','יזמים ומשקיעים','אקדמיה ומחקר','תקשורת מקומית','קהילות ייעודיות']
  };
  const LEVELS=['ליידע','להתייעץ','לשתף','להעצים'];
  const DATA_SUGG={
    'סוג · כמותי (מספרים)':['פניות למוקד לחודש','אחוזים ומגמות','זמני טיפול והמתנה','עלויות ותקציב','היקפי שירות','השוואה למדד ארצי'],
    'סוג · איכותני (הסיפור)':['ראיון עומק','תצפית בשטח','מסע לקוח','שיחת שטח קצרה','ציטוטים מתושבים','סקר שביעות רצון'],
    'דמוגרפיה':['גודל אוכלוסייה','התפלגות גילאים','מדד חברתי-כלכלי','הגירה פנימית','גודל משק בית','שפות ומגזרים'],
    'כלכלה ותקציב':['ארנונה','תקציב הרשות','רמת הכנסה','עסקים פעילים','פתיחת וסגירת עסקים','אבטלה ותעסוקה'],
    'חינוך':['מספר תלמידים','מוסדות חינוך','נשירה','הישגים','ביקוש מול היצע','הסעות'],
    'תחבורה ותנועה':['קווי תחבורה ציבורית','נפחי תנועה','חניה','תאונות דרכים','זמני נסיעה','נגישות'],
    'מרחב, דיור ותכנון':['שימושי קרקע','היתרי בנייה','שטחים פתוחים','צפיפות בנייה','שכבות GIS','מחירי דיור'],
    'סביבה ותשתיות':['פינוי אשפה','זיהום ורעש','צריכת מים וחשמל','תאורת רחוב','גינון ותחזוקה','מפגעים'],
    'רווחה, בריאות וביטחון':['פניות רווחה','אוכלוסיות בסיכון','שירותי בריאות','ביטחון אישי','אירועי חירום','פשיעה מקומית'],
    'שירות ופניות ציבור':['פניות מוקד 106','זמן מענה','נושאים חוזרים','דירוג שירות','ערוצי פנייה','נטישת תהליכים']
  };
  const SOURCES=[
    {n:'data.gov.il — מאגרי המידע הממשלתיים', u:'https://data.gov.il/he', d:'מאות מאגרים פתוחים: תחבורה, חינוך, סביבה, כלכלה ועוד'},
    {n:'הלמ״ס — אפיון ודירוג הרשויות', u:'https://www.cbs.gov.il/he/subjects/Pages/אפיון-הרשויות-המקומיות-ודירוגן.aspx', d:'מדד חברתי-כלכלי ונתונים דמוגרפיים לפי רשות'},
    {n:'GovMap — אתר המפות הממשלתי', u:'https://www.govmap.gov.il/', d:'GIS, גוש/חלקה, שכבות מידע מרחביות'},
    {n:'שקיפות בחינוך — משרד החינוך', u:'https://shkifut.education.gov.il', d:'נתוני חינוך ותקציב לפי רשות ומוסד'},
    {n:'תקציב פתוח — Open Budget', u:'https://obudget.org', d:'תקציבי משרדים ורשויות מקומיות'},
    {n:'חצ״ב — GIS תחבורה (משרד התחבורה)', u:'https://geo.mot.gov.il/', d:'מידע תחבורתי-מרחבי'},
    {n:'הלמ״ס — אתר ראשי', u:'https://www.cbs.gov.il/he', d:'סטטיסטיקה על אוכלוסייה, כלכלה וחברה'},
    {n:'OpenStreetMap', u:'https://www.openstreetmap.org', d:'מפה פתוחה, נקודות עניין, שימושי קרקע'}
  ];

  function fresh(){ return {meta:{title:'',authority:'',author:'',date:new Date().toLocaleDateString('he-IL')}, challenge:'', affected:'', scope:'', hmw:'', stakeholders:[], dataItems:[]}; }
  function persist(){ try{ localStorage.setItem(LS_KEY, JSON.stringify({data,step})); }catch(e){} }
  function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function attr(s){ return esc(s).replace(/"/g,'&quot;'); }

  function init(){
    try{ const s=JSON.parse(localStorage.getItem(LS_KEY)); if(s&&s.data){ data=s.data; step=s.step||1; } }catch(e){}
    if(!data) data=fresh();
    document.getElementById('fileIn').addEventListener('change', onFile);
    render();
  }
  function onFile(e){ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ data=JSON.parse(r.result); step=4; render(); toast('העבודה נטענה'); }catch(err){ toast('הקובץ אינו תקין'); } }; r.readAsText(f); e.target.value=''; }

  function stepComplete(s){ if(s===1) return !!(data.challenge&&data.challenge.trim()); return true; }
  function setStep(n){ n=Math.max(1,Math.min(4,n)); if(n>step){ for(let s=1;s<n;s++){ if(!stepComplete(s)){ step=s; render(); toast('כדי להמשיך — כתבו קודם את האתגר'); requestAnimationFrame(()=>{ const el=document.getElementById('challengeIn'); if(el){ el.classList.add('shake'); el.focus(); setTimeout(()=>el.classList.remove('shake'),500);} }); return; } } } step=n; render(); }

  function stepbarHTML(){
    const labels=['האתגר','בעלי עניין','נתונים','סיכום']; const parts=['הגדרת האתגר','מיפוי בעלי עניין','נתונים רלוונטיים','סיכום וייצוא'];
    const fill=((step-1)/3*100);
    const segs=labels.map((l,i)=>{ const n=i+1,c=n<step?'done':(n===step?'active':''); return `<div class="sb-seg ${c}"><span class="sb-num">${n<step?'✓':n}</span><span class="sb-lbl">${l}</span></div>`; }).join('');
    return `<div class="stepbar"><div class="sb-head">שלב ${step} מתוך 4 · ${parts[step-1]}</div><div class="sb-track"><div class="sb-line"><div class="fill" style="width:${fill}%"></div></div>${segs}</div></div>`;
  }
  const SAVEWARN='<div class="save-warn"><span></span><span>העבודה נשמרת רק במחשב שלכם. בסוף שמרו קובץ, ייצאו תמונה או שמרו לענן — אחרת המידע לא נשמר במקום אחר.</span></div>';
  function micBtn(t){ return `<button class="mic" data-target="${t}" title="הכתבה קולית" aria-label="הכתבה קולית"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0M12 17v3"/></svg></button>`; }

  function render(){
    document.getElementById('barActions').innerHTML = step===4? `<button class="btn btn-brand" onclick="App.exportPNG()">הורדת תמונה</button>` : `<button class="btn btn-ghost" onclick="document.getElementById('fileIn').click()">טעינת עבודה</button>`;
    let body='';
    if(step===1) body=stepChallenge();
    else if(step===2) body=stepStakeholders();
    else if(step===3) body=stepData();
    else body=stepSummary();
    const nav=`<div class="g-nav">${step>1?`<button class="btn btn-ghost" onclick="App.setStep(${step-1})">→ הקודם</button>`:''}${step<4?`<button class="btn btn-brand" onclick="App.setStep(${step+1})">הבא ←</button>`:`<button class="btn btn-ghost" onclick="App.resetAll()">התחלה מחדש</button>`}</div>`;
    document.getElementById('content').innerHTML = stepbarHTML()+SAVEWARN+`<div class="panel">${body}</div>`+nav;
    wire();
    persist();
  }

  function stepChallenge(){
    return `<div class="eyebrow">שלב 1 · הגדרה</div><h2 class="title">מהו האתגר?</h2>
      <div class="why">כתבו את האתגר העירוני ב<b>משפט או שניים</b>. תארו מצב קיים — לא פתרון. אפשר להכתיב בקול .</div>
      <div class="field-label">תיאור האתגר</div>
      <div class="in-wrap"><textarea id="challengeIn" placeholder="לדוגמה: מרכז העיר מתרוקן, עסקים נסגרים ותושבים צעירים עוזבים…">${esc(data.challenge)}</textarea>${micBtn('challengeIn')}</div>
      <div class="field-label">מי מושפע? <span style="font-weight:400;color:var(--ink-soft)">(לא חובה)</span></div>
      <div class="in-wrap inline"><input class="txt" id="affIn" placeholder="תושבים, בעלי עסקים, הולכי רגל…" value="${attr(data.affected)}">${micBtn('affIn')}</div>
      <div class="field-label">היכן / היקף התופעה? <span style="font-weight:400;color:var(--ink-soft)">(לא חובה)</span></div>
      <div class="in-wrap inline"><input class="txt" id="scopeIn" placeholder="שכונה, רחוב, כל העיר, מספרים אם ידועים…" value="${attr(data.scope)}">${micBtn('scopeIn')}</div>
      <div class="field-label">ניסוח כשאלת עיצוב <span style="font-weight:400;color:var(--ink-soft)">(HMW — לא חובה)</span></div>
      <div class="in-wrap inline"><input class="txt" id="hmwIn" placeholder="כיצד נוכל… לעודד פעילות במרכז העיר בערב?" value="${attr(data.hmw)}">${micBtn('hmwIn')}</div>
      <div class="tips"><h4>טיפים לניסוח</h4><ul>
        <li><span class="good">כן:</span> מצב קיים, קונקרטי, שאפשר לחקור.</li>
        <li><span class="bad">לא:</span> "חסר מתחם" — זה כבר פתרון.</li>
        <li>ניסוח "כיצד נוכל…" פותח מרחב לפתרונות מבלי לנעול אותם.</li>
      </ul></div>`;
  }

  function stepStakeholders(){
    let chips='';
    for(const g in STK){ chips+=`<div class="sugg-group"><h4>${g}</h4><div class="chips">`+STK[g].map(name=>{ const used=data.stakeholders.some(s=>s.name===name); return `<button class="chip ${used?'used':''}" onclick="App.addStk('${attr(name)}','${g}')"><span class="p">+</span>${esc(name)}</button>`; }).join('')+`</div></div>`; }
    const items = data.stakeholders.length? `<div class="items">`+data.stakeholders.map(s=>`
      <div class="item stk">
        <div class="item-top"><span class="item-name" contenteditable="true" data-edit="stk:${s.id}">${esc(s.name)}</span><button class="del" onclick="App.delStk('${s.id}')" title="הסרה">×</button></div>
        <div class="item-fields">
          <input class="txt grow" data-note="stk:${s.id}" placeholder="למה הם רלוונטיים? מה התפקיד?" value="${attr(s.note)}">
          <select class="txt lvl" data-lvl="${s.id}">${LEVELS.map(l=>`<option ${s.level===l?'selected':''}>${l}</option>`).join('')}</select>
        </div>
      </div>`).join('')+`</div>` : `<div class="empty">עדיין לא נבחרו בעלי עניין — הוסיפו מההצעות למעלה או כתבו משלכם.</div>`;
    return `<div class="eyebrow">שלב 2 · מיפוי</div><h2 class="title">מי בעלי העניין?</h2>
      <div class="why">מי צריך להיות מעורב, מיודע או מושפע? לחצו על הצעות כדי להוסיף, וקבעו לכל אחד <b>רמת מעורבות</b> (מסולם השיתוף: ליידע ← להתייעץ ← לשתף ← להעצים).</div>
      ${chips}
      <div class="add-row"><div class="in-wrap inline"><input class="txt" id="addStkIn" placeholder="בעל עניין נוסף…">${micBtn('addStkIn')}</div><button class="add-btn" onclick="App.addStkCustom()">הוספה</button></div>
      ${items}`;
  }

  function stepData(){
    let chips='';
    for(const g in DATA_SUGG){ chips+=`<div class="sugg-group"><h4>${g}</h4><div class="chips">`+DATA_SUGG[g].map(name=>{ const used=data.dataItems.some(d=>d.name===name); return `<button class="chip ${used?'used':''}" onclick="App.addData('${attr(name)}')"><span class="p">+</span>${esc(name)}</button>`; }).join('')+`</div></div>`; }
    const items = data.dataItems.length? `<div class="items">`+data.dataItems.map(d=>`
      <div class="item dat">
        <div class="item-top"><span class="item-name" contenteditable="true" data-edit="dat:${d.id}">${esc(d.name)}</span><button class="del" onclick="App.delData('${d.id}')" title="הסרה">×</button></div>
        <div class="item-fields">
          <input class="txt grow" data-note="dat:${d.id}" placeholder="למה הנתון הזה חשוב לאתגר?" value="${attr(d.note)}">
          <input class="txt src" data-src="${d.id}" placeholder="מקור (למ״ס, מוקד…)" value="${attr(d.source)}">
        </div>
      </div>`).join('')+`</div>` : `<div class="empty">עדיין לא נבחרו נתונים — הוסיפו מההצעות, או מהמקורות המומלצים למטה.</div>`;
    const sources = `<div class="sources"><h4>מקורות נתונים מומלצים</h4><div class="sub">לחצו לפתיחת המקור, או על "הוסף לרשימה" כדי לצרף אותו לאתגר.</div><div class="src-list">`+
      SOURCES.map(s=>`<div class="src-card" style="cursor:default"><a class="n" href="${attr(s.u)}" target="_blank" rel="noopener">↗ ${esc(s.n)}</a><div class="d">${esc(s.d)}</div><a class="add" href="#" onclick="App.addSource(${JSON.stringify(s.n).replace(/"/g,'&quot;')},${JSON.stringify(s.u).replace(/"/g,'&quot;')});return false;">+ הוסף לרשימה</a></div>`).join('')+`</div></div>`;
    return `<div class="eyebrow">שלב 3 · נתונים</div><h2 class="title">אילו נתונים יעזרו?</h2>
      <div class="why">אילו נתונים יעזרו להבין את האתגר, למדוד אותו או להוכיח אותו? בחרו סוגי נתונים, וקשרו אותם למקורות אמיתיים.</div>
      ${chips}
      <div class="add-row"><div class="in-wrap inline"><input class="txt" id="addDataIn" placeholder="נתון נוסף שאתם מחפשים…">${micBtn('addDataIn')}</div><button class="add-btn" onclick="App.addDataCustom()">הוספה</button></div>
      ${items}
      ${sources}`;
  }

  function stepSummary(){
    const stk = data.stakeholders.length? `<ul>`+data.stakeholders.map(s=>`<li><b>${esc(s.name)}</b> — ${esc(s.level||'')}${s.note?` · ${esc(s.note)}`:''}</li>`).join('')+`</ul>` : '—';
    const dat = data.dataItems.length? `<ul>`+data.dataItems.map(d=>`<li><b>${esc(d.name)}</b>${d.source?` — מקור: ${esc(d.source)}`:''}${d.note?` · ${esc(d.note)}`:''}</li>`).join('')+`</ul>` : '—';
    const cloudUrl = (()=>{try{return localStorage.getItem(CLOUD_KEY)||''}catch(e){return''}})();
    return `<div class="eyebrow">שלב 4 · סיכום</div><h2 class="title">סיכום האתגר</h2>
      <div class="meta-grid" style="margin-top:16px">
        <input class="txt" id="mTitle" placeholder="שם האתגר / הפרויקט" value="${attr(data.meta.title)}">
        <input class="txt" id="mAuth" placeholder="רשות מקומית" value="${attr(data.meta.authority)}">
        <input class="txt" id="mBy" placeholder="שם ממלא/ת" value="${attr(data.meta.author)}">
      </div>
      <div class="sum-sec"><h3><span class="dot" style="background:var(--brand)"></span>האתגר</h3><div class="body">${esc(data.challenge)||'—'}${data.hmw?`<br><b>כיצד נוכל:</b> ${esc(data.hmw)}`:''}${data.affected?`<br><b>מושפעים:</b> ${esc(data.affected)}`:''}${data.scope?`<br><b>היקף:</b> ${esc(data.scope)}`:''}</div></div>
      <div class="sum-sec"><h3><span class="dot" style="background:var(--root)"></span>בעלי עניין (${data.stakeholders.length})</h3><div class="body">${stk}</div></div>
      <div class="sum-sec"><h3><span class="dot" style="background:var(--leaf)"></span>נתונים רלוונטיים (${data.dataItems.length})</h3><div class="body">${dat}</div></div>

      <div class="field-label">ייצוא ושמירה</div>
      <div class="exp-grid">
        <button class="btn btn-brand" onclick="App.exportPNG()">הורדה כתמונה</button>
        <button class="btn btn-ghost" onclick="App.copyText()">העתקת סיכום</button>
        <button class="btn btn-ghost" onclick="App.saveFile()">שמירת קובץ עבודה</button>
        <button class="btn btn-ghost" onclick="document.getElementById('fileIn').click()">טעינת קובץ</button>
      </div>


      <div class="cloud">
        <h4>שמירה לענן <span style="font-weight:400;color:var(--ink-soft);font-size:12.5px">(אופציונלי — לאיסוף כל התשובות בגיליון Google)</span></h4>
        <div class="row"><input class="txt" id="cloudUrl" placeholder="הדביקו כאן כתובת Web App של Google Apps Script" value="${attr(cloudUrl)}"><button class="btn btn-dark" onclick="App.saveCloud()">שליחה</button></div>
        <details class="setup"><summary>איך מגדירים ענן חינמי (פעם אחת)?</summary>
          <ol>
            <li>פותחים גיליון Google חדש → תפריט <b>Extensions → Apps Script</b>.</li>
            <li>מדביקים את הקוד הבא ושומרים:</li>
          </ol>
          <pre>function doPost(e){
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sh = ss.getSheetByName('Data') || ss.insertSheet('Data');
  var d = JSON.parse(e.postData.contents);
  sh.appendRow([new Date(), d.meta.title, d.meta.authority,
    d.meta.author, d.challenge,
    (d.stakeholders||[]).map(s=>s.name).join(', '),
    (d.dataItems||[]).map(x=>x.name).join(', '),
    JSON.stringify(d)]);
  return ContentService.createTextOutput('ok');
}</pre>
          <ol start="3">
            <li><b>Deploy → New deployment → Web app</b>. הרשאות: <b>Execute as: Me</b>, <b>Who has access: Anyone</b>.</li>
            <li>מעתיקים את כתובת ה-Web app, מדביקים כאן, ולוחצים "שליחה". כל שליחה תופיע כשורה בגיליון.</li>
          </ol>
        </details>
      </div>`;
  }

  /* mutations */
  function addStk(name,group){ if(!data.stakeholders.some(s=>s.name===name)){ data.stakeholders.push({id:nid(),name,group,note:'',level:LEVELS[1]}); render(); } }
  function addStkCustom(){ const el=document.getElementById('addStkIn'); const v=(el.value||'').trim(); if(!v) return; data.stakeholders.push({id:nid(),name:v,group:'',note:'',level:LEVELS[1]}); el.value=''; render(); }
  function delStk(id){ data.stakeholders=data.stakeholders.filter(s=>s.id!==id); render(); }
  function addData(name){ if(!data.dataItems.some(d=>d.name===name)){ data.dataItems.push({id:nid(),name,source:'',url:'',note:''}); render(); } }
  function addDataCustom(){ const el=document.getElementById('addDataIn'); const v=(el.value||'').trim(); if(!v) return; data.dataItems.push({id:nid(),name:v,source:'',url:'',note:''}); el.value=''; render(); }
  function addSource(name,url){ data.dataItems.push({id:nid(),name:name,source:name.split('—')[0].trim(),url:url,note:''}); render(); toast('נוסף לרשימת הנתונים'); }
  function delData(id){ data.dataItems=data.dataItems.filter(d=>d.id!==id); render(); }
  function resetAll(){ if(confirm('להתחיל אתגר חדש ולמחוק את הנוכחי?')){ data=fresh(); step=1; render(); } }

  function wire(){
    const bind=(id,key)=>{ const el=document.getElementById(id); if(el) el.addEventListener('input',e=>{ data[key]=e.target.value; persist(); }); };
    bind('challengeIn','challenge'); bind('affIn','affected'); bind('scopeIn','scope'); bind('hmwIn','hmw');
    ['mTitle:title','mAuth:authority','mBy:author'].forEach(p=>{ const [id,k]=p.split(':'); const el=document.getElementById(id); if(el) el.addEventListener('input',e=>{ data.meta[k]=e.target.value; persist(); }); });
    document.querySelectorAll('[data-note]').forEach(el=>el.addEventListener('input',e=>{ const [t,id]=el.dataset.note.split(':'); const arr=t==='stk'?data.stakeholders:data.dataItems; const it=arr.find(x=>x.id===id); if(it){it.note=e.target.value; persist();} }));
    document.querySelectorAll('[data-lvl]').forEach(el=>el.addEventListener('change',e=>{ const it=data.stakeholders.find(x=>x.id===el.dataset.lvl); if(it){it.level=e.target.value; persist();} }));
    document.querySelectorAll('[data-src]').forEach(el=>el.addEventListener('input',e=>{ const it=data.dataItems.find(x=>x.id===el.dataset.src); if(it){it.source=e.target.value; persist();} }));
    document.querySelectorAll('[data-edit]').forEach(el=>el.addEventListener('blur',e=>{ const [t,id]=el.dataset.edit.split(':'); const arr=t==='stk'?data.stakeholders:data.dataItems; const it=arr.find(x=>x.id===id); if(it){it.name=el.innerText.trim(); persist();} }));
    const cu=document.getElementById('cloudUrl'); if(cu) cu.addEventListener('input',e=>{ try{ localStorage.setItem(CLOUD_KEY, e.target.value.trim()); }catch(e){} });
    document.querySelectorAll('.mic').forEach(b=>b.addEventListener('click',()=>{ const t=document.getElementById(b.dataset.target); if(t) dictate(t,b); }));
  }

  /* dictation */
  let recog=null;
  function dictate(el,btn){ const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR){ toast('הכתבה קולית נתמכת בדפדפני Chrome / Edge'); return; } if(recog){ recog.stop(); return; } recog=new SR(); recog.lang='he-IL'; recog.interimResults=true; recog.continuous=false; const base=(el.value||'').trim(); btn.classList.add('rec'); recog.onresult=(e)=>{ let f='',i='';for(let k=0;k<e.results.length;k++){const r=e.results[k]; if(r.isFinal)f+=r[0].transcript; else i+=r[0].transcript;} el.value=(base?base+' ':'')+(f+i).trim(); el.dispatchEvent(new Event('input',{bubbles:true})); }; recog.onend=()=>{ btn.classList.remove('rec'); recog=null; el.focus(); }; recog.onerror=(ev)=>{ btn.classList.remove('rec'); recog=null; if(ev.error==='not-allowed'||ev.error==='service-not-allowed') toast('יש לאשר גישה למיקרופון'); }; try{ recog.start(); toast('מקשיב… דברו בעברית'); }catch(e){ btn.classList.remove('rec'); recog=null; } }

  /* export */
  function identity(){
    try{ var s=JSON.parse(localStorage.getItem('toolkit_identity')||'{}');
      return [s.name,s.dept,s.role].filter(Boolean).join(' · ');
    }catch(e){ return ''; }
  }
  function fileName(ext){ const t=(data.meta.title||'הגדרת-אתגר').replace(/[\\/:*?"<>|]/g,'').slice(0,40); return t+'.'+ext; }
  let mc; function measure(){ if(!mc) mc=document.createElement('canvas').getContext('2d'); return mc; }
  function wrapLines(text,maxW,font){ const c=measure(); c.font=font; const words=(text||'').split(/\s+/).filter(Boolean); if(!words.length) return ['']; const L=[]; let cur=words[0]; for(let i=1;i<words.length;i++){ const t=cur+' '+words[i]; if(c.measureText(t).width<=maxW) cur=t; else{L.push(cur);cur=words[i];} } L.push(cur); return L; }

  function drawDoc(scale){
    const W=820, PAD=40, cw=W-PAD*2; const F='Alef, sans-serif';
    // pre-measure to compute height
    const blocks=[];
    function addHeading(t,color){ blocks.push({type:'h',t,color}); }
    function addText(t){ const lines=wrapLines(t,cw-16,`400 15px ${F}`); blocks.push({type:'p',lines}); }
    function addList(arr){ arr.forEach(t=>{ const lines=wrapLines('•  '+t,cw-20,`400 14px ${F}`); blocks.push({type:'li',lines}); }); }
    addHeading('האתגר','#B4502F');
    let ch=data.challenge||'—'; if(data.hmw) ch+='  —  כיצד נוכל: '+data.hmw; if(data.affected) ch+='  ('+ 'מושפעים: '+data.affected+')';
    addText(ch);
    addHeading('בעלי עניין','#D99A2B');
    if(data.stakeholders.length) addList(data.stakeholders.map(s=>`${s.name} — ${s.level||''}${s.note?' · '+s.note:''}`)); else addText('—');
    addHeading('נתונים רלוונטיים','#2E7D4F');
    if(data.dataItems.length) addList(data.dataItems.map(d=>`${d.name}${d.source?' — '+d.source:''}${d.note?' · '+d.note:''}`)); else addText('—');

    const headerH=84, footerH=40; let y=headerH+24;
    blocks.forEach(b=>{ if(b.type==='h') y+=34; else if(b.type==='p') y+=b.lines.length*22+8; else y+=b.lines.length*20+4; });
    const H=y+footerH+20;

    const cv=document.createElement('canvas'); cv.width=W*scale; cv.height=H*scale; const x=cv.getContext('2d'); x.scale(scale,scale);
    x.fillStyle='#FAF5EC'; x.fillRect(0,0,W,H);
    x.fillStyle='#1F5F5B'; x.fillRect(0,0,W,headerH);
    x.direction='rtl'; x.textBaseline='middle';
    x.fillStyle='#FFFDF8'; x.textAlign='right'; x.font=`700 25px ${F}`; x.fillText(data.meta.title||'הגדרת האתגר', W-PAD, 32);
    x.font=`400 14px ${F}`; x.fillStyle='rgba(255,255,255,.82)';
    const sub=[identity(),data.meta.authority,data.meta.date].filter(Boolean).join(' · '); if(sub) x.fillText(sub, W-PAD, 60);
    x.textAlign='left'; x.font=`700 12px ${F}`; x.fillStyle='rgba(255,255,255,.7)'; x.fillText('אתגר · בעלי עניין · נתונים', PAD, 40);

    y=headerH+24;
    blocks.forEach(b=>{
      if(b.type==='h'){ x.textAlign='right'; x.fillStyle=b.color; x.font=`700 18px ${F}`; x.beginPath(); x.arc(W-PAD-5,y+2,5,0,7); x.fill(); x.fillText('   '+b.t, W-PAD, y+2); y+=34; }
      else if(b.type==='p'){ x.textAlign='right'; x.fillStyle='#2A211B'; x.font=`400 15px ${F}`; b.lines.forEach((ln,i)=>x.fillText(ln, W-PAD, y+i*22+8)); y+=b.lines.length*22+8; }
      else { x.textAlign='right'; x.fillStyle='#2A211B'; x.font=`400 14px ${F}`; b.lines.forEach((ln,i)=>x.fillText(ln, W-PAD, y+i*20+2)); y+=b.lines.length*20+4; }
    });
    x.textAlign='center'; x.fillStyle='#6B5D52'; x.font=`400 12px ${F}`; x.fillText('נבנה ע"י רומן גרינשטיין · romangash@gmail.com', W/2, H-footerH/2);
    return cv;
  }
  function exportPNG(){ try{ const cv=drawDoc(2); cv.toBlob(b=>{ const u=URL.createObjectURL(b); const a=document.createElement('a'); a.href=u; a.download=fileName('png'); a.click(); setTimeout(()=>URL.revokeObjectURL(u),1500); toast('התמונה הורדה'); },'image/png'); }catch(e){ toast('שגיאה בייצוא'); } }
  function copyText(){ let t=`${data.meta.title||'הגדרת האתגר'}\n${[data.meta.authority,data.meta.author].filter(Boolean).join(' · ')}\n\n■ האתגר:\n${data.challenge||'—'}\n`; if(data.hmw)t+=`כיצד נוכל: ${data.hmw}\n`; t+=`\n■ בעלי עניין:\n`+(data.stakeholders.map(s=>`• ${s.name} (${s.level||''})${s.note?' — '+s.note:''}`).join('\n')||'—'); t+=`\n\n■ נתונים רלוונטיים:\n`+(data.dataItems.map(d=>`• ${d.name}${d.source?' — '+d.source:''}${d.note?' — '+d.note:''}`).join('\n')||'—'); t+=`\n\n— נבנה בכלי "הגדרת האתגר" מאת רומן גרינשטיין`; (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('הסיכום הועתק')).catch(()=>prompt('העתיקו ידנית:',t)); }
  function saveFile(){ const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}); const u=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=u; a.download=fileName('json'); a.click(); setTimeout(()=>URL.revokeObjectURL(u),1500); toast('קובץ העבודה נשמר'); }
  function makeBlob(){
    return new Promise(function(res,rej){
      try{ drawDoc(2).toBlob(function(b){ b?res(b):rej(new Error('blob')); },'image/png'); }
      catch(e){ rej(e); }
    });
  }
  function downloadBlob(bl){
    var u=URL.createObjectURL(bl); var a=document.createElement('a');
    a.href=u; a.download=fileName('png'); document.body.appendChild(a); a.click();
    setTimeout(function(){ try{document.body.removeChild(a);}catch(e){} URL.revokeObjectURL(u); },1500);
  }

  async function saveCloud(){ let url=''; try{ url=localStorage.getItem(CLOUD_KEY)||''; }catch(e){} const inp=document.getElementById('cloudUrl'); if(inp&&inp.value.trim()) url=inp.value.trim(); if(!url){ toast('קודם הדביקו כתובת Web App'); return; } try{ await fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...data,savedAt:new Date().toISOString()})}); toast('נשלח לענן ✓ — בדקו בגיליון'); }catch(e){ toast('השליחה נכשלה — בדקו את הכתובת'); } }

  let toastT; function toast(m){ const el=document.getElementById('toast'); el.textContent=m; el.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),2600); }

  return { init, setStep, addStk, addStkCustom, delStk, addData, addDataCustom, addSource, delData, resetAll, exportPNG, copyText, saveFile, saveCloud };
})();
window.App=App; App.init();
</script>
